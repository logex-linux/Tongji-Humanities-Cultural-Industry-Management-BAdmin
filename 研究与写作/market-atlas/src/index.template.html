<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>市场图鉴 · 行业 × 岗位 × 盈利模式知识库</title>
<meta name="description" content="覆盖 192 个行业、91 个岗位、262 种盈利模式的完整市场知识库。">
<style>
/*__APP_CSS__*/
</style>
</head>
<body>
<a class="skip" href="#main">跳到主内容</a>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 20V10"/><path d="M11 20V5"/><path d="M16 20v-7"/><path d="M21 20v-3"/></svg>
      </span>
      <span class="brand-text">
        <b>市场图鉴</b>
        <small>Market Atlas</small>
      </span>
    </div>

    <div class="search" role="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索行业、岗位、盈利模式…" autocomplete="off" spellcheck="false" aria-label="搜索">
      <kbd>/</kbd>
    </div>

    <nav class="tabs" role="tablist" aria-label="视图">
      <button class="tab is-on" role="tab" data-view="industry" aria-selected="true">行业</button>
      <button class="tab" role="tab" data-view="role" aria-selected="false">岗位</button>
      <button class="tab" role="tab" data-view="model" aria-selected="false">盈利模式</button>
    </nav>

    <button class="icon-btn" id="theme" title="切换深浅色" aria-label="切换深浅色">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <div class="side-block" id="filters"></div>
  </aside>

  <main id="main" class="main">
    <section class="hero">
      <h1>看懂一个行业怎么赚钱</h1>
      <p>把市场拆成三样东西：<b>行业</b>决定钱从哪来，<b>盈利模式</b>决定怎么收钱，<b>岗位</b>决定谁在收钱。共收录 <b id="s-ind">0</b> 个行业、<b id="s-role">0</b> 个岗位、<b id="s-model">0</b> 种盈利模式，其中 <b id="s-patch">0</b> 条已按 <span id="s-asof">2026 年</span>当期实况校准，<b id="s-glossary">0</b> 条术语有大白话解释。</p>
      <div class="macro" id="macro"></div>
      <div class="guide-cta">
        <button class="g-btn g-btn-main" id="open-guide">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 7h7M8 11h7"/></svg>
          新手导读：四步看懂一个行业
        </button>
        <button class="g-btn" id="open-glossary">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M5 7h14M5 12h14M5 17h14"/></svg>
          术语表
        </button>
      </div>
    </section>

    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <div class="sorts">
        <label for="sort">排序</label>
        <select id="sort">
          <option value="name">名称</option>
          <option value="growth">增长前景</option>
          <option value="margin">毛利水平</option>
          <option value="competition">竞争强度</option>
          <option value="regulation">监管强度</option>
          <option value="recurring">收入经常性</option>
          <option value="capital">资本密集度</option>
        </select>
      </div>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>
      <p>没有匹配项。</p>
      <button class="btn" id="reset">清空筛选</button>
    </div>
  </main>
</div>

<footer class="foot">
  <p>数据为知识库性质的通用归纳，薪酬区间为一线城市参考值，非实时报价。用于理解商业结构，不作为投资或求职建议。</p>
</footer>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-bg" data-close></div>
  <article class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <button class="drawer-x" data-close aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="drawer-body" class="drawer-body"></div>
  </article>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-sheet-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="drawer-x" data-sheet-close aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <input class="sheet-search" id="sheet-q" type="search" placeholder="搜索术语…" autocomplete="off" spellcheck="false" hidden>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<script>
/*__DATA_JS__*/
</script>
<script>
/*__APP_JS__*/
</script>
</body>
</html>
