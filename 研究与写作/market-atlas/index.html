<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>市场图鉴 · 行业 × 岗位 × 盈利模式知识库</title>
<meta name="description" content="覆盖 192 个行业、91 个岗位、262 种盈利模式的完整市场知识库。">
<style>
/* ===== 市场图鉴 — 设计令牌 ===== */
:root {
  --bg: #f4f2ec;
  --bg-elev: #fffefb;
  --surface: #ffffff;
  --surface-2: #f6f4ee;
  --line: #e4e0d5;
  --line-strong: #cec9ba;

  --ink: #14130f;
  --ink-2: #3d3b34;
  --ink-3: #6b685f;
  --ink-4: #948f83;

  --accent: #d1551f;
  --accent-soft: #fce9dd;
  --accent-ink: #a33f13;

  --a1: #2a7a4e;  /* 农业 */
  --a2: #6f60a0;  /* 矿产 */
  --a3: #b07c3a;  /* 化工 */
  --a4: #356590;  /* 制造 */
  --a5: #965f3e;  /* 建筑 */
  --a6: #c95c40;  /* 消费 */
  --a7: #4a90a4;  /* 医疗 */
  --a8: #8a782e;  /* 教育 */
  --a9: #3f7ba0;  /* 科技 */
  --a10: #a04e76; /* 传媒 */
  --a11: #2a7a7a; /* 金融 */
  --a12: #657937;  /* 物流 */
  --a13: #b25c41; /* 服务 */
  --a14: #4c7852; /* 公共 */
  --a15: #64508a; /* 政府 */

  --r-s: 6px;
  --r-m: 10px;
  --r-l: 14px;

  --sh-1: 0 1px 2px rgba(26,24,21,.05), 0 1px 3px rgba(26,24,21,.04);
  --sh-2: 0 4px 16px rgba(26,24,21,.07), 0 1px 3px rgba(26,24,21,.05);
  --sh-3: 0 18px 50px rgba(26,24,21,.16);

  --sans: "Inter", "SF Pro SC", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, monospace;

  --side-w: 208px;
}

[data-theme="dark"] {
  --bg: #16150f;
  --bg-elev: #1e1c16;
  --surface: #23211a;
  --surface-2: #2a2820;
  --line: #35322a;
  --line-strong: #474338;

  --ink: #f5f2e8;
  --ink-2: #d3cdbd;
  --ink-3: #a29b8b;
  --ink-4: #756f62;

  --accent: #e88a55;
  --accent-soft: #35241a;
  --accent-ink: #f2ad86;

  --a1: #6cb287; --a2: #9c8ac9; --a3: #d3a45e; --a4: #74a5d1;
  --a5: #c38d66; --a6: #e58c74; --a7: #79b6c9; --a8: #b8a75c;
  --a9: #79aed3; --a10: #cf8ca8; --a11: #6cbcbc; --a12: #a2b46e;
  --a13: #e28f75; --a14: #80ad89; --a15: #a08ecd;

  --sh-1: 0 1px 2px rgba(0,0,0,.3);
  --sh-2: 0 4px 18px rgba(0,0,0,.4);
  --sh-3: 0 18px 54px rgba(0,0,0,.55);
}

/* ===== 基础 ===== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 0;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); color: var(--accent-ink); }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 0 0 var(--r-m) 0;
}
.skip:focus { left: 0; }

/* ===== 顶栏 ===== */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1440px; margin: 0 auto;
  display: flex; align-items: center; gap: 18px;
  padding: 11px 22px;
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--ink); color: var(--bg-elev);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.brand-text small { font-size: 10px; color: var(--ink-3); letter-spacing: .09em; text-transform: uppercase; }

.search {
  flex: 1; max-width: 460px;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  padding: 0 10px; height: 36px;
  color: var(--ink-3);
  transition: border-color .16s, box-shadow .16s;
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { flex: 1; border: 0; background: none; outline: none; color: var(--ink); min-width: 0; }
.search input::placeholder { color: var(--ink-4); }
.search kbd {
  font-family: var(--mono); font-size: 10px; color: var(--ink-4);
  border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px; background: var(--surface-2);
}

.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: var(--r-m); border: 1px solid var(--line); }
.tab {
  padding: 6px 14px; border-radius: 7px; font-size: 13px; font-weight: 520;
  color: var(--ink-2); transition: background .14s, color .14s;
  white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); font-weight: 600; }

.icon-btn {
  width: 36px; height: 36px; border-radius: var(--r-m);
  display: grid; place-items: center; flex-shrink: 0;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  transition: color .14s, border-color .14s;
}
.icon-btn:hover { color: var(--accent); border-color: var(--accent); }
.i-moon { display: none; }
[data-theme="dark"] .i-sun { display: none; }
[data-theme="dark"] .i-moon { display: block; }

/* ===== 布局 ===== */
.shell {
  max-width: 1440px; margin: 0 auto;
  display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr);
  gap: 26px; padding: 22px;
  align-items: start;
}
.side { position: sticky; top: 79px; }
.main { min-width: 0; }

/* ===== 侧栏筛选 ===== */
.side-block { display: flex; flex-direction: column; gap: 18px; }
.side-h {
  font-size: 10px; font-weight: 680; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-4); margin: 0 0 7px;
}
.f-list { display: flex; flex-direction: column; gap: 1px; }
.f-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: var(--r-s);
  font-size: 12.5px; color: var(--ink-2); text-align: left; width: 100%;
  transition: background .12s, color .12s;
}
.f-item:hover { background: var(--surface-2); color: var(--ink); }
.f-item.is-on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.f-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: currentColor; opacity: .85; }
.f-num { margin-left: auto; font-size: 10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.f-item.is-on .f-num { color: var(--accent-ink); opacity: .7; }

.range-row { display: flex; align-items: center; gap: 8px; }
.range-row input[type=range] { flex: 1; accent-color: var(--accent); height: 18px; }
.range-val {
  font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 5px; padding: 2px 6px; min-width: 26px; text-align: center;
}
.toggles { display: flex; flex-direction: column; gap: 3px; }
.tg {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: var(--r-s); font-size: 12.5px; color: var(--ink-2);
  width: 100%; text-align: left;
}
.tg:hover { background: var(--surface-2); color: var(--ink); }
.tg.is-on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.tg-box {
  width: 13px; height: 13px; border-radius: 3.5px; border: 1.5px solid var(--line-strong);
  flex-shrink: 0; display: grid; place-items: center; color: transparent;
}
.tg.is-on .tg-box { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ===== Hero ===== */
.hero { margin-bottom: 18px; }
.hero h1 {
  margin: 0 0 6px; font-size: clamp(22px, 3vw, 30px); font-weight: 680;
  letter-spacing: -.025em; line-height: 1.2;
}
.hero p { margin: 0; color: var(--ink-3); max-width: 68ch; }
.hero b { color: var(--ink); font-weight: 640; font-variant-numeric: tabular-nums; }

/* 宏观背景条 */
.macro {
  margin-top: 14px; display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px;
}
.macro-item {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  border-radius: var(--r-m); padding: 9px 11px;
}
.macro-k {
  font-size: 10px; font-weight: 680; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-4); margin-bottom: 3px;
}
.macro-v { font-size: 12px; color: var(--ink-2); line-height: 1.5; }

/* ===== 工具条 ===== */
.toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--line);
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 99px; padding: 3px 8px 3px 10px;
  font-size: 12px; color: var(--ink-2);
}
.chip b { color: var(--ink); font-weight: 600; }
.chip button { color: var(--ink-4); display: grid; place-items: center; border-radius: 50%; }
.chip button:hover { color: var(--accent); }
.chip.clear { padding: 3px 10px; color: var(--accent); border-color: var(--accent); font-weight: 600; }
.sorts { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); }
.sorts select {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s);
  padding: 4px 7px; font-size: 12px; color: var(--ink-2);
}

/* ===== 卡片网格 ===== */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }
.card {
  position: relative; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-l); padding: 14px 15px 13px;
  display: flex; flex-direction: column; gap: 9px;
  transition: border-color .15s, box-shadow .15s, transform .15s;
  overflow: hidden;
}
.card::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
  background: var(--c, var(--accent)); opacity: .85;
}
.card:hover { border-color: var(--line-strong); box-shadow: var(--sh-2); transform: translateY(-1px); }
.c-head { display: flex; align-items: baseline; gap: 8px; }
.c-name { font-size: 14.5px; font-weight: 640; letter-spacing: -.01em; }
.c-en { font-size: 10.5px; color: var(--ink-4); letter-spacing: .01em; }
.c-tag {
  margin-left: auto; flex-shrink: 0;
  font-size: 10px; font-weight: 620; letter-spacing: .04em;
  padding: 2px 7px; border-radius: 99px;
  background: var(--surface-2); color: var(--ink-3);
}
.c-note {
  font-size: 12.5px; color: var(--ink-2); line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.c-meters { display: flex; flex-direction: column; gap: 4px; }
.meter { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.meter-k { color: var(--ink-4); width: 44px; flex-shrink: 0; }
.meter-t { flex: 1; height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter-f { height: 100%; border-radius: 99px; background: var(--c, var(--accent)); opacity: .8; }
.meter-v { font-family: var(--mono); font-size: 10px; color: var(--ink-3); width: 10px; text-align: right; font-variant-numeric: tabular-nums; }
.c-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 1px; }
.pill {
  font-size: 10.5px; color: var(--ink-2); background: var(--surface-2);
  border-radius: 5px; padding: 2px 6px;
}
.pill.more { color: var(--ink-4); background: none; border: 1px dashed var(--line-strong); }

.empty { text-align: center; padding: 60px 20px; color: var(--ink-3); }
.btn {
  margin-top: 12px; background: var(--accent); color: #fff;
  border-radius: var(--r-m); padding: 8px 16px; font-weight: 600; font-size: 13px;
}
.btn:hover { filter: brightness(1.08); }

/* ===== 抽屉 ===== */
.drawer { position: fixed; inset: 0; z-index: 60; }
.drawer-bg { position: absolute; inset: 0; background: rgba(20,18,15,.42); backdrop-filter: blur(2px); animation: fade .18s ease; }
.drawer-panel {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(560px, 100%);
  background: var(--bg-elev); border-left: 1px solid var(--line);
  box-shadow: var(--sh-3);
  display: flex; flex-direction: column;
  animation: slide .24s cubic-bezier(.22,.8,.3,1);
}
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); opacity: .5; } }
.drawer-x {
  position: absolute; top: 14px; right: 14px; z-index: 2;
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-2);
}
.drawer-x:hover { color: var(--accent); border-color: var(--accent); }
.drawer-body { overflow-y: auto; padding: 26px 28px 40px; }

.d-hero { padding-right: 40px; margin-bottom: 20px; }
.d-kicker {
  font-size: 10px; font-weight: 680; letter-spacing: .12em; text-transform: uppercase;
  color: var(--c, var(--accent)); margin-bottom: 6px;
}
.d-title { margin: 0 0 4px; font-size: 23px; font-weight: 680; letter-spacing: -.02em; line-height: 1.25; }
.d-sub { margin: 0; color: var(--ink-3); font-size: 12.5px; }
.d-lead {
  margin: 14px 0 0; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--accent));
  border-radius: var(--r-m); font-size: 13.5px; line-height: 1.65; color: var(--ink);
}

.d-sec { margin-top: 22px; }
.d-sec-h {
  font-size: 10.5px; font-weight: 680; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-4); margin: 0 0 9px;
  padding-bottom: 6px; border-bottom: 1px solid var(--line);
}
.d-rows { display: flex; flex-direction: column; gap: 0; }
.d-row {
  display: grid; grid-template-columns: 84px 1fr; gap: 12px;
  padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13px;
}
.d-row:last-child { border-bottom: 0; }
.d-row dt { color: var(--ink-3); font-size: 12px; }
.d-row dd { margin: 0; color: var(--ink); }
.d-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.d-tag {
  font-size: 11.5px; padding: 2px 8px; border-radius: 6px;
  background: var(--surface-2); color: var(--ink-2);
}
a.d-tag { transition: background .12s, color .12s; }
a.d-tag:hover { background: var(--accent-soft); color: var(--accent-ink); }

.d-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.d-metric {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: 9px 11px;
}
.d-metric-k { font-size: 10.5px; color: var(--ink-4); margin-bottom: 3px; }
.d-metric-v { font-size: 15px; font-weight: 640; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.d-metric-v small { font-size: 11px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }

.d-pay { display: flex; flex-direction: column; gap: 7px; }
.pay-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.pay-k { width: 44px; color: var(--ink-3); flex-shrink: 0; }
.pay-bar { flex: 1; height: 18px; background: var(--surface-2); border-radius: 5px; position: relative; overflow: hidden; }
.pay-fill { position: absolute; inset: 0 auto 0 0; background: var(--c, var(--accent)); opacity: .18; }
.pay-txt {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums;
}

.d-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.chain-step {
  font-size: 11.5px; padding: 4px 9px; border-radius: 99px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-2);
}
.chain-arrow { color: var(--ink-4); font-size: 11px; }

.d-callout {
  margin-top: 8px; padding: 10px 12px; border-radius: var(--r-m);
  background: var(--accent-soft); color: var(--accent-ink); font-size: 12.5px; line-height: 1.6;
}
.d-callout b { font-weight: 660; }

/* 当期实况块 */
.d-live {
  margin-top: 8px; padding: 11px 13px; border-radius: var(--r-m);
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--c, var(--accent));
  font-size: 12.5px; line-height: 1.65; color: var(--ink-2);
}
.d-live-tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 680; letter-spacing: .06em; text-transform: uppercase;
  color: var(--c, var(--accent)); margin-bottom: 5px;
}
.d-live-tag::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: currentColor;
}

/* 小白讲解块 */
.d-plain {
  margin-top: 10px; padding: 12px 14px; border-radius: var(--r-m);
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 13px; line-height: 1.7; color: var(--ink);
}
.d-plain-h {
  font-size: 10px; font-weight: 680; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-4); margin-bottom: 6px;
}
.d-quote {
  margin: 8px 0 0; padding: 8px 12px;
  border-left: 2px solid var(--c, var(--accent));
  background: var(--surface); border-radius: 0 var(--r-s) var(--r-s) 0;
  font-size: 12.5px; line-height: 1.65; color: var(--ink-2);
}
.d-quote b { color: var(--ink-3); font-weight: 620; }
.d-kv { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.d-kv-row { display: grid; grid-template-columns: 58px 1fr; gap: 10px; font-size: 12.5px; line-height: 1.65; }
.d-kv-k { color: var(--ink-4); font-weight: 600; }
.d-kv-v { color: var(--ink-2); }

/* 导读入口按钮 */
.guide-cta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.g-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r-m); padding: 8px 14px;
  font-size: 13px; font-weight: 560; color: var(--ink-2);
  transition: border-color .14s, color .14s, background .14s;
}
.g-btn:hover { border-color: var(--accent); color: var(--accent); }
.g-btn-main { background: var(--ink); border-color: var(--ink); color: var(--bg-elev); }
.g-btn-main:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

/* 全屏面板（导读 / 术语表） */
.sheet { position: fixed; inset: 0; z-index: 70; }
.sheet-bg { position: absolute; inset: 0; background: rgba(20,18,15,.45); backdrop-filter: blur(2px); animation: fade .18s ease; }
.sheet-panel {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(760px, 100%);
  background: var(--bg-elev); border-left: 1px solid var(--line);
  box-shadow: var(--sh-3);
  display: flex; flex-direction: column;
  animation: slide .24s cubic-bezier(.22,.8,.3,1);
}
.sheet-head {
  padding: 24px 28px 14px; border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}

":"买面粉做面包卖。面粉贵了或面包便宜了，你就白干。","watch":"看价差和历史成本曲线位置。行业里成本最低的那批人永远能活，成本高的先死。"},{"id":"take-rate","family":"transaction","name":"交易抽成","formula":"GMV × 佣金率","margin":"平台佣金率 2%–20%，边际成本低","lever":"GMV 规模、商户黏性、供给稀缺性","industries":["fin-payment","log-airline","log-rail","public-tourism"],"fail":"商户利润被抽干后迁移到更低费率平台","cases":["美团","滴滴","Airbnb","贝壳"],"risk":["商户议价","监管反垄断","补贴"],"note":"撮合买卖双方，按成交额收佣，规模效应极强。","plain":"我不生产也不卖货，我只是搭个台子让买家和卖家见面，每成交一笔我抽一点。","analogy":"庙会收摊位费。摊主赚不赚不管，庙会主办方按天收租金。","watch":"看 GMV 和抽成比例。抽成太高商家会跑，太低覆盖不了成本。"},{"id":"freight-spread","family":"transaction","name":"运力价差","formula":"运费收入 − 运力成本","margin":"毛利率 5%–15%，取决于规模与信息化","lever":"信息匹配效率、返程配载、车队规模","industries":["log-freight","log-airline","log-rail","log-customs"],"fail":"运价下行叠加返程空驶，毛利被双向压缩","cases":["满帮","货代","合同物流"],"risk":["运价波动","账期","运力过剩"],"note":"买运力卖运力，信息差和返程配载是利润来源。","plain":"从车主那里便宜包车，再高价报给货主，赚中间的运费差价。信息不对称时利润最高。","analogy":"像黄牛：原价拿票，加价卖给急用的人。","watch":"看回程配载率。空车跑回来那趟是纯亏损，配载上才能赚钱。"},{"id":"factoring-fee","family":"transaction","name":"保理融资费","formula":"应收账款 × 折价率 × 期限","margin":"年化 6%–15%，靠真实贸易背景","lever":"核心企业信用、确权比例、周转速度","industries":["fin-factoring"],"fail":"虚假贸易或核心企业拒付导致应收无法回收","cases":["商业保理","银行保理","供应链金融平台"],"risk":["信用风险","欺诈","集中度"],"note":"提前把应收账款变现，赚时间价值和信用差价。","plain":"你手里有别人欠你的应收账款但急着用钱，我打折买过来，等钱到了我收全款，折扣部分就是我的利润。","analogy":"你把三个月后才到期的欠条，现在打九折卖给需要现金的人。","watch":"看交易背景真实性。假的应收账款会让这笔钱血本无归。"},{"id":"microfinance-interest","family":"transaction","name":"小微贷款利息","formula":"本金 × 利率 × 期限","margin":"年化 12%–24%，需覆盖高坏账与线下成本","lever":"风险定价能力、人海战术密度、资金成本","industries":["fin-fintech-lending","fin-microfinance"],"fail":"坏账率超过利率上限，或政策限制利率空间","cases":["中和农信","村镇银行","消费金融"],"risk":["信用风险","政策风险","共债"],"note":"高风险高定价，线下风控与本地关系是核心。","plain":"把钱借给银行不愿意借的人，收很高的利息，用高利息覆盖一部分人不还钱造成的损失。","analogy":"高风险高回报。你借 10 个人，2 个不还，靠另外 8 个人的高利息补回来还有赚。","watch":"看不良率和利率上限。利率被政策封顶时，风控差的公司立刻活不下去。"},{"id":"pawn-interest","family":"transaction","name":"典当与质押融资","formula":"当金 × 综合费率","margin":"月综合费率 2%–4%，需覆盖物品处置风险","lever":"鉴定估值能力、折当率、处置渠道","industries":[],"fail":"绝当物品处置价低于当金，或流当积压资金","cases":["典当行","黄金质押","奢侈品典当"],"risk":["估值风险","流动性","监管"],"note":"以物抵钱的短拆生意，赚综合费，赚的是急用钱的信息差。","plain":"你拿值钱的东西押在我这儿换现金，按月付综合费。东西我不要，你还钱来赎；不赎我就卖掉。","analogy":"当铺。你押一块表借 1 万，每月付 300，三个月不赎表就归我处理。","watch":"看折当率（借出去的钱占物品价值的比例）。放得太满，处置时可能亏。"},{"id":"auction-commission","family":"transaction","name":"拍卖佣金","formula":"成交价 × 佣金率","margin":"佣金率 5%–25%，两头收费时更高","lever":"标的稀缺性、买家网络、鉴定公信力","industries":[],"fail":"流拍率高或鉴定失误导致赔付与信誉损失","cases":["佳士得","苏富比","司法拍卖"],"risk":["真伪争议","流拍","周期"],"note":"稀缺资产加竞价机制，成交价越高佣金越高。","plain":"我组织竞价，让买家互相抬价，成交后向卖家或买家收一笔佣金。拍得越贵，我收得越多。","analogy":"像婚介所，促成一对收一份钱，而且感情越好（成交价越高）收费越高。","watch":"看流拍率和鉴定准确度。老拍不出去就没收入，看错了要赔。"},{"id":"escrow-fee","family":"transaction","name":"托管与资金存管","formula":"托管资金 × 服务费率","margin":"费率 0.05%–0.5%，规模效应极强","lever":"托管规模、资金留存时间、合规牌照","industries":[],"fail":"资金规模萎缩或费率被监管强制下调","cases":["支付机构备付金","证券托管","房产交易资金监管"],"risk":["合规风险","资金安全","利率"],"note":"替人管钱收服务费，躺在资金池上稳定收租。","plain":"买卖双方互不信任，钱先放我这儿，事办成了再转给卖家。我期间管着这笔钱，收服务费。","analogy":"像房产交易中的资金监管账户，钥匙交了房才放款。","watch":"看托管资金规模和停留时间。钱在我账上躺着也是收益。"},{"id":"custody-fee","family":"transaction","name":"资产托管费","formula":"托管资产 × 费率","margin":"费率 0.01%–0.1%，重资产高门槛","lever":"托管规模、清算效率、跨境网络","industries":[],"fail":"规模不足时清算与合规成本无法摊薄","cases":["银行托管部","道富银行","汇丰托管"],"risk":["操作风险","合规","规模"],"note":"替机构看资产、做清算，规模生意，赢家通吃。","plain":"机构把钱和证券放我这儿，我负责保管、清算、记账，按托管资产规模收费。钱越多我收得越多。","analogy":"像银行的保险箱业务，只不过存的是几十亿的股票债券。","watch":"看托管规模和清算效率。规模不够，系统和合规成本摊不薄。"},{"id":"asset-management-fee","family":"asset","name":"资产管理费","formula":"AUM × 管理费率","margin":"管理费率 0.1%–2%，被动产品更低","lever":"AUM 规模、长期业绩、渠道能力","industries":["re-commercial","fin-banking","fin-securities","fin-asset-management","fin-pe-vc","fin-trust","fin-quant-fund","fin-crypto"],"fail":"业绩长期落后导致赎回，规模萎缩费率难覆盖成本","cases":["BlackRock","易方达","华夏基金"],"risk":["业绩风险","赎回","费率下行"],"note":"权益市场回暖带动规模与收入双修复，是银行最明确的中收增量。","plain":"你把钱交给我打理，我不管赚没赚，都按你账户里的钱收固定比例的管理费。这是最舒服的收费方式。","analogy":"像物业公司，不管你家房子涨没涨，每月物业费照收。","watch":"看管理规模（AUM）。规模是复利，业绩好规模才留得住。"},{"id":"insurance-premium","family":"asset","name":"保险保费","formula":"保费收入 = 风险对价 + 运营成本 + 利润","margin":"综合成本率低于 100% 才有承保利润","lever":"风险定价、规模分散、投资端收益","industries":["fin-insurance-life","fin-insurance-property"],"fail":"巨灾或定价失误导致赔付率失控，或投资端亏损","cases":["中国平安","Allstate","Swiss Re"],"risk":["巨灾风险","定价风险","投资风险"],"note":"保费增长平稳，利润更依赖投资端与成本控制。","plain":"你怕出事，定期交点小钱给我；真出事了，我赔你一大笔。赌的是大多数人不会同时出事。","analogy":"全楼道凑钱，谁家着火用这笔钱赔。大多数人用不上，凑的钱就是保险公司的。","watch":"看综合成本率。低于 100% 才赚承保的钱，高于 100% 是靠投资补。"},{"id":"underwriting-margin","family":"asset","name":"承保利润","formula":"保费 − 赔付 − 费用","margin":"财险综合成本率 95%–103%，寿险看三差","lever":"死差、费差、利差","industries":["fin-investment-bank","fin-insurance-life","fin-insurance-property"],"fail":"风险选择失误或投资收益率低于承诺成本","cases":["财险公司","寿险公司","再保险"],"risk":["赔付波动","利差损","退保"],"note":"保险的核心利润来源，精算能力的直接体现。","plain":"收上来的保费，减去赔出去的钱，再减去运营费用，剩下的就是承保利润。这是保险的老本行。","analogy":"开赌场但精算了赔率，长期看每一注都占一点优势。","watch":"看赔付率和费用率。这两项失控，收多少保费都不够赔。"},{"id":"investment-income","family":"asset","name":"投资收益","formula":"资产收益 − 资金成本","margin":"取决于资产配置与杠杆","lever":"资产配置、久期管理、信用挖掘","industries":["fin-securities","fin-insurance-life","fin-insurance-property","fin-factoring","fin-trust","fin-crypto"],"fail":"利率下行或信用暴发导致资产端收益低于负债成本","cases":["保险资金","银行自营","养老金"],"risk":["市场风险","信用风险","再投资"],"note":"拿浮存金和准备金做投资，赚资产收益与资金成本之差。","plain":"把收来的保费、准备金拿去做投资，赚到的投资收益归自己。保险真正的利润大头常在这儿。","analogy":"你先把会员费收了，钱在账上趴着，拿它去买理财，收益白赚。","watch":"看投资收益率和资产质量。投亏了比承保亏损更致命。"},{"id":"leasing-rent","family":"asset","name":"租赁租金","formula":"租金收入 − 资产折旧 − 资金成本","margin":"租赁净收益率 3%–8%","lever":"资产利用率、残值管理、资金成本","industries":["fin-leasing","srv-wedding"],"fail":"出租率下滑或残值低于预期，回本期拉长","cases":["飞机租赁","设备租赁","汽车租赁"],"risk":["残值风险","信用风险","利用率"],"note":"资产不卖只租，收租覆盖折旧和利息后即利润。","plain":"东西不卖，只租。租金覆盖折旧和利息后剩下的就是利润。租期越长赚得越稳。","analogy":"买房出租。租金减月供和维修费，剩的是你的，房子最后还升值。","watch":"看出租率和残值。租不出去就是纯亏折旧。"},{"id":"real-estate-sale","family":"asset","name":"房产销售","formula":"售价 − 土地 − 建安 − 税费 − 财务","margin":"净利率 5%–15%，高杠杆下 ROE 放大","lever":"周转速度、地价房价比、杠杆","industries":["re-developer","log-rail","srv-funeral"],"fail":"销售去化不畅叠加债务到期，高杠杆反噬","cases":["保利发展","万科","碧桂园"],"risk":["政策风险","去化风险","债务"],"note":"新房开发销售进入存量萎缩期，现房销售改革进一步推高资金门槛。","plain":"低价拿地，盖成房子，高价卖掉。杠杆高时一点价差就能放大成很高的回报。","analogy":"批发原材料加工后零售。只不过这个「原材料」是土地，周期特别长。","watch":"看净利率和去化速度。2026 年新房销售还在双位数下滑，这个模式正在失效。"},{"id":"property-rental","family":"asset","name":"物业租金","formula":"租金 − 运营成本 − 折旧","margin":"NOI 收益率 4%–8%","lever":"出租率、租金坪效、资本化率","industries":["re-developer","re-rental","re-commercial","re-industrial","retail-mall"],"fail":"空置率上升或资本化率走高，资产估值缩水","cases":["商业地产","产业园","长租公寓"],"risk":["空置风险","资本化率","改造开支"],"note":"存量时代租金业务比开发销售更稳，二手房与租赁是增量。","plain":"把房子或商铺租出去收租金，扣除运营成本和折旧。退出时把资产整体卖掉，可能比租金赚得更多。","analogy":"像会下蛋的鹅，蛋是现金流，鹅本身还在增值。","watch":"看出租率和资本化率。资本化率一升，资产估值就跌。"},{"id":"hotel-adr","family":"asset","name":"酒店房费","formula":"RevPAR = OCC × ADR","margin":"GOP 率 25%–45%，加盟模式更高","lever":"入住率、房价、直销占比、翻新周期","industries":["media-theme-park","public-tourism","public-hotel"],"fail":"固定成本刚性，RevPAR 跌破盈亏平衡即亏损","cases":["华住","万豪","华住会"],"risk":["需求波动","固定成本","渠道依赖"],"note":"房间每天卖一次，入住率乘房价决定盈亏。","plain":"房间一天卖一次，卖价乘以入住率就是收入。房间空着就是纯亏，因为折旧照算。","analogy":"像出租车，跑着才赚钱，停着烧钱。","watch":"看 RevPAR（入住率×房价）。这个数跌破盈亏平衡点就亏。"},{"id":"asset-securitization","family":"asset","name":"资产证券化","formula":"基础资产现金流分层定价","margin":"优先次级利差 1%–5%","lever":"资产池质量、分层设计、发行时点","industries":["re-developer","re-rental","re-commercial","re-industrial"],"fail":"基础资产现金流断裂导致分层违约与信誉崩塌","cases":["REITs","ABS","消费金融 ABS"],"risk":["结构风险","流动性","基础资产"],"note":"把未来现金流提前变现，赚发行利差和管理费。","plain":"把未来能收到的钱（房租、高速费、贷款还款）打包成证券卖给投资者，提前把钱拿到手。","analogy":"你把未来十年的工资一次性折价抵押出去，现在就拿到一笔大钱。","watch":"看基础资产质量。底层现金流断了，整条链都崩。"},{"id":"fund-carried-interest","family":"asset","name":"超额收益分成","formula":"收益超过门槛部分 × 20%","margin":"分成比例通常 20%，可能极高也可能为零","lever":"投资能力、项目选择、退出时点","industries":["fin-asset-management","fin-pe-vc","fin-quant-fund"],"fail":"基金整体亏损或退出困难，分成归零","cases":["KKR","红杉中国","黑石"],"risk":["业绩风险","退出环境","锁定期"],"note":"赚投资回报的分成，赌的是判断力和时机。","plain":"我帮有钱人管钱，先约定一个门槛收益，超过的部分我抽两成。赚了大钱我才有得分。","analogy":"像帮人炒股，赚了分三成，亏了不赔。听着美，但得真赚到。","watch":"看 DPI（实际分到手的钱）和退出环境。退出不了，分成永远停在账面上。"},{"id":"residual-value","family":"asset","name":"残值收益","formula":"处置价 − 账面净值","margin":"取决于市场与使用强度","lever":"估值能力、处置渠道、使用管理","industries":["fin-leasing"],"fail":"技术迭代或市场过剩使残值低于预期","cases":["汽车租赁","设备租赁","二手车"],"risk":["残值波动","技术迭代"],"note":"租期结束卖掉资产，赌的是保值能力。","plain":"东西租到期后卖掉，卖价比账面剩下的价值高，差额就是利润。赌的是这东西保值。","analogy":"租车三年后卖掉，发现还能卖个不错的价格，比预期多赚的就是它。","watch":"看二手市场价格。技术一迭代，残值就可能归零。"},{"id":"used-equipment-sale","family":"asset","name":"二手设备处置","formula":"二手价 − 整备成本","margin":"毛利率 15%–40%","lever":"整备能力、渠道、信息差","industries":["re-crane","fin-leasing","srv-repair"],"fail":"整备成本失控或二手价格暴跌","cases":["二手工程机械","二手服务器","二手奢侈品"],"risk":["价格波动","整备成本","质量"],"note":"低买高卖的再生生意，专业整备是溢价来源。","plain":"低价收二手设备，翻新整备后高价卖出。赚的是信息差和手艺钱。","analogy":"二手车商收车、整备、加价卖。懂行的人才能收到便宜好货。","watch":"看整备成本和出手周期。压在手里的每一天都是资金成本。"},{"id":"carbon-credit","family":"asset","name":"碳资产交易","formula":"碳价 × 减排量","margin":"取决于碳价与项目成本","lever":"减排量、碳价、方法学","industries":["agri-forestry","tech-clean-tech","pub-waste"],"fail":"方法学失效或碳价下跌，项目收益归零","cases":["CCER","林业碳汇","VCS"],"risk":["政策风险","价格波动","核证"],"note":"把减排量变成可交易资产，政策创造的市场。","plain":"减排行为被核定成一张可卖的凭证，高排放企业要买这张凭证来抵消自己的排放。","analogy":"你把省下来的汽油额度，卖给汽油超标的人用。","watch":"看碳价和政策。政策一变，这个市场可能一夜消失。"},{"id":"saas-subscription","family":"recurring","name":"SaaS 订阅","formula":"席位或实例 × 月费 × 12","margin":"毛利率 70%–85%，规模效应显著","lever":"NDR 净收入留存、获客效率、产品黏性","industries":["agri-smart","mfg-robotics","mfg-consumer-electronics","mfg-display","re-surveying","edu-edtech","tech-software","tech-ai","tech-cyber","tech-data","tech-iot","fin-payment","log-packaging-supply","srv-translation","gov-e-gov"],"fail":"客户不愿为 SaaS+AI 付费，或 AI 智能体让企业能低成本自建系统，席位制定价直接失效","cases":["Salesforce","Notion","钉钉"],"risk":["续费风险","竞争","获客成本"],"note":"按账号收租的地租模式正被按结果付费掏空，AI 原生 SaaS 是唯一出路。","plain":"软件放在云上，你按月或按年付费用。一次开发，卖无数次，边际成本几乎为零。","analogy":"像自来水厂，管道铺好了，多接一户多收一份钱。","watch":"看 NDR（净收入留存）。超过 100% 说明不拉新也能涨，低于 100% 就是在漏水。"},{"id":"enterprise-license","family":"recurring","name":"企业授权许可","formula":"授权费 + 年维护费","margin":"软件许可毛利率 80% 以上","lever":"客户数量、定价权、续约率","industries":["tech-software","tech-data","tech-device","tech-chip-ecad"],"fail":"客户转向开源或订阅制竞品，许可收入萎缩","cases":["Oracle","SAP","Microsoft"],"risk":["续约","开源替代","迁移成本"],"note":"一次性或年度授权收费，历史上最赚钱的软件模式。","plain":"把软件授权给企业用，一次性或按年收授权费，另加每年的维护费。","analogy":"像买 DVD，碟是你的，但只能在家看，想多用得多买。","watch":"看续约率和开源替代威胁。开源免费产品是这个模式最大的敌人。"},{"id":"membership-fee","family":"recurring","name":"会员费","formula":"会员数 × 年费","margin":"纯会员费近乎纯利，常搭配权益成本","lever":"会员数、续费率、权益感知价值","industries":["re-rental","retail-supermarket","retail-mall","retail-category","retail-dutyfree","retail-pharmacy","retail-fnb","retail-beverage","retail-beauty","retail-motherbaby","retail-luxury","health-dental","edu-k12","edu-online","edu-arts","media-publishing","media-theme-park","log-airline","srv-laundry","srv-carwash"],"fail":"权益价值感不足，续费率下滑且拉新困难","cases":["Costco","京东 PLUS","航司常旅客"],"risk":["续费率","权益成本","感知价值"],"note":"先收钱再给权益，现金流前置，续费是生命线。","plain":"先收一笔会员费，承诺给一些权益。会员费近乎白赚，权益是成本。","analogy":"像 Costco，不靠卖货赚钱，靠会员费就能有稳定利润。","watch":"看续费率。权益感知价值不够，第二年就没人续。"},{"id":"subscription-box","family":"recurring","name":"订阅盒子","formula":"订阅数 × 客单价 × 复购期数","margin":"毛利率 30%–50%","lever":"复购率、选品能力、履约成本","industries":["retail-brand-dtc","retail-beauty","retail-motherbaby"],"fail":"复购率下滑或选品失误导致退订潮","cases":[" Dollar Shave Club","鲜花订阅","宠物粮订阅"],"risk":["复购风险","选品","物流"],"note":"定期送货上门，把一次性消费变成持续订阅。","plain":"每个月固定给你寄一箱东西，你按月付费。把一次性消费变成持续订阅。","analogy":"像订牛奶，每天送到，钱月月扣。","watch":"看复购率和选品。东西不合意，退订比下单还快。"},{"id":"subscription-media","family":"recurring","name":"内容订阅","formula":"订阅数 × 月费","margin":"毛利率 30%–60%，内容成本是主要支出","lever":"独家内容、用户留存、涨价空间","industries":["health-mental","edu-k12","edu-online","edu-library","edu-language","tech-consumer-internet","tech-telecom","tech-chip-ecad","media-film","media-music","media-publishing","fin-credit-rating"],"fail":"内容投入无法留住用户，退订率超过新增","cases":["Netflix","Spotify","得到"],"risk":["内容成本","退订","盗版"],"note":"持续付费看内容，独占内容和推荐算法是护城河。","plain":"内容放在平台上，想看就得持续付费。内容是最大成本，留住用户是唯一目标。","analogy":"像办了健身卡，去不去都收钱，平台赌你不会天天用。","watch":"看退订率和内容投入产出。内容吸引不来新用户，老用户也在流失。"},{"id":"service-monthly","family":"recurring","name":"包月服务费","formula":"服务周期 × 月费","margin":"毛利率 20%–40%","lever":"人效、续约率、标准化程度","industries":["re-property","health-eldercare","edu-childcare","log-lastmile","srv-housekeeping","srv-security","srv-cleaning"],"fail":"人效无法支撑月费，或服务非标导致续约差","cases":["物业保洁","安保驻点","代运营"],"risk":["人力成本","续约","标准化"],"note":"按周期收服务费，人效和续约决定利润。","plain":"签长期合同，按月上门服务、按月收钱。稳定但人力成本刚性。","analogy":"像小区保洁，合同一签三年，每月来几次收几次钱。","watch":"看人效和续约率。人一多就亏，续不上就断。"},{"id":"retainer","family":"recurring","name":"顾问年费","formula":"年费或月度顾问费","margin":"人力杠杆生意，毛利率 40%–70%","lever":"专业溢价、客户续约、团队杠杆","industries":["media-advertising","media-pr","srv-consulting","srv-accounting","srv-legal"],"fail":"客户感知价值下降或内部团队替代外部顾问","cases":["律所","公关公司","咨询"],"risk":["客户预算","人才流失","口碑"],"note":"提前锁定客户预算，稳定但需持续证明价值。","plain":"客户提前锁定你的时间，按月或按年付顾问费，有事优先处理。","analogy":"像家庭医生年费会员，平时小病随时问，不用单次付费。","watch":"看客户续约和实际使用量。费用照付但不用你，是最理想的状态。"},{"id":"franchise-fee","family":"recurring","name":"加盟费","formula":"加盟费 + 持续权益金","margin":"近乎纯利，总部成本主要是支持体系","lever":"品牌力、单店模型、加盟商存活率","industries":["retail-cvs","retail-category","retail-fnb","retail-beverage","edu-childcare","edu-arts","public-hotel"],"fail":"加盟商大面积亏损：餐饮闭店率 23.7%，98% 的加盟诉讼由加盟商发起；喜茶停招、霸王茶姬改分成","cases":["麦当劳","蜜雪冰城","7-Eleven"],"risk":["加盟商存活","品牌管理","法律"],"note":"加盟模式正在重构，从收加盟费转向共担风险。","plain":"你把成功的模式和品牌授权给别人开，收加盟费，还持续从他那儿进货赚差价。","analogy":"像收学徒：教手艺收学费，徒弟以后开店买我的料我还赚。","watch":"看加盟商存活率。加盟商大面积亏损，品牌就完了。"},{"id":"service-contract","family":"recurring","name":"运维服务合同","formula":"设备或系统 × 年服务费","margin":"服务毛利率 40%–60%","lever":"装机基数、服务覆盖率、备件利润","industries":["mfg-semi-front","mfg-semi-osat","mfg-machinery","mfg-robotics","mfg-cnc","mfg-ship","mfg-rail","mfg-aviation","mfg-battery","mfg-furniture","mfg-instrument","re-decoration","re-crane","retail-automotive","health-device","health-ivd","health-rehab","edu-edtech","tech-data","tech-device","tech-chip-ecad","tech-iot","log-supplychain","log-packaging-supply","gov-e-gov"],"fail":"装机量下降或客户自建维保团队","cases":["电梯维保","医疗设备服务","IT 运维"],"risk":["装机量、成本、竞争"],"note":"装机后靠长期服务收租，是设备厂商的现金牛。","plain":"设备卖出去后，签长期维保合同，每年收服务费。装机量就是存量的印钞机。","analogy":"像电梯维保，装一台锁一份长约，年年收钱。","watch":"看装机基数和备件毛利。装机量一下滑，服务收入跟着断。"},{"id":"managed-service","family":"recurring","name":"托管运营服务","formula":"托管规模或用量 × 月费","margin":"毛利率 30%–50%","lever":"自动化程度、客户数、人效","industries":["mine-service","srv-security","public-survey"],"fail":"自动化不足导致人效低于收费，或安全事故","cases":["安全托管 MSS","云托管","IT 外包"],"risk":["服务质量、事故、人力"],"note":"替客户长期运营某块业务，收管理费。","plain":"我不卖工具给你，我直接替你长期运营某块业务，收管理费。","analogy":"像把公司 IT 外包给专业团队，他们连人带系统一起管。","watch":"看自动化程度和事故率。出事一次可能赔光全年利润。"},{"id":"extended-warranty","family":"recurring","name":"延保服务","formula":"延保费 − 预期维修成本","margin":"毛利率 40%–60%","lever":"定价精算、故障率控制、渗透率","industries":["srv-repair","srv-funeral"],"fail":"实际故障率高于精算假设，赔付吃掉利润","cases":["家电延保","汽车延保","3C 延保"],"risk":["精算风险","投诉","成本"],"note":"赌产品不会坏，赚的是概率差价。","plain":"赌你的东西不会坏。你付一笔延保费，真坏了我免费修，不坏我就白赚。","analogy":"像赌运气，但我算过概率，长期一定赚。","watch":"看实际故障率和精算假设。坏得比算的多，就亏。"},{"id":"prepaid-card","family":"recurring","name":"预付费卡金","formula":"充值额 − 消耗成本 − 未消耗余额","margin":"毛利率高，未消耗部分是纯利润","lever":"充值转化、消耗率、客单价","industries":["srv-beauty-salon"],"fail":"监管限制预付费，或门店关闭导致集中挤兑","cases":["美容卡","健身卡","理发卡"],"risk":["监管","挤兑","闭店"],"note":"先收钱后服务，未消耗余额是时间价值和闭店利润。","plain":"你先把钱充进来，慢慢用。没用完的钱是我的纯利润，你还被我锁定了。","analogy":"像游戏点卡，充了 100 只用 60，剩下 40 平台白赚。","watch":"看消耗率和闭店风险。钱在账上但店倒了，就是负债。"},{"id":"usage-metering","family":"usage","name":"按量计费","formula":"实际用量 × 单价","margin":"毛利率 50%–75%，随规模摊薄成本","lever":"用量增长、客户留存、定价弹性","industries":["agri-smart","tech-software","tech-ai","tech-telecom","tech-iot","media-film"],"fail":"客户用量下降或单价被竞争压至成本以下","cases":["AWS 按量","云存储","API 计费"],"risk":["用量波动","价格战","成本"],"note":"按量计费仍是主流，但计价锚点正从调用次数转向任务完成度。","plain":"用多少付多少。客户小时照付，但我成本也随用量涨，规模上去才有钱赚。","analogy":"像打车按公里计费，走得越多付越多。","watch":"看用量增长和单位成本。价格战一起，这个模式最先受伤。"},{"id":"api-call-fee","family":"usage","name":"API 调用费","formula":"调用次数 × 单价","margin":"直接 API 业务推理利润率已超 80%，模型厂商整体付费推理利润率 50%–65%","lever":"调用规模、开发者生态、不可替代性","industries":["tech-cloud","tech-ai","fin-credit-rating"],"fail":"开源替代或巨头免费策略切断收入","cases":["OpenAI API","地图 API","短信 API"],"risk":["开源、价格、生态"],"note":"API 是模型厂商的核心收入引擎，利润率极高。","plain":"把能力封装成接口，别人调一次收一次钱。边际成本极低，规模效应恐怖。","analogy":"像自来水厂按吨收费，龙头装好了，多用多付。","watch":"看调用量和客户留存。巨头一免费，这个模式就危险。"},{"id":"cloud-iaas","family":"usage","name":"云基础设施","formula":"资源用量 × 单价","margin":"毛利率 20%–40%，靠利用率提升","lever":"资源利用率、客户规模、产品广度","industries":["tech-cloud"],"fail":"价格战与低利用率叠加，重资产折旧压垮毛利","cases":["AWS","阿里云","Azure"],"risk":["价格战、利用率、折旧"],"note":"把机房和服务器租出去，规模与利用率决定毛利。","plain":"把机房、服务器、网络租出去，按用了多少资源收费。重资产，靠利用率赚钱。","analogy":"像二房东，整租下来分租给散户，赚差价和空置率的钱。","watch":"看资源利用率和上架率。机器空转就是纯亏电费。"},{"id":"cloud-paas","family":"usage","name":"云平台服务","formula":"平台用量或实例 × 单价","margin":"毛利率 60%–80%","lever":"生态锁定、开发者规模、产品深度","industries":["tech-cloud","tech-quantum"],"fail":"客户迁移到多云或被开源方案替代","cases":["数据库 PaaS","容器平台","AI 平台"],"risk":["锁定、开源、竞争"],"note":"在基础设施之上卖更省事的平台，毛利更高黏性更强。","plain":"在基础设施之上再包一层，把数据库、中间件、开发工具都准备好，客户直接用。","analogy":"像精装房vs毛坯，IaaS 给毛坯，PaaS 直接给能住的。","watch":"看客户锁定和生态。迁移成本越高，客户越跑不掉。"},{"id":"per-parcel-fee","family":"usage","name":"单件收费","formula":"件数 × 单件收入 − 单件成本","margin":"单票毛利 0.1–1 元，靠规模","lever":"单量、单票成本、网络密度","industries":["log-express"],"fail":"单票成本高于单票收入，规模越大亏越多","cases":["快递","同城配送","物流"],"risk":["价格战、人力、成本"],"note":"单价极低但量极大，单票成本每降一分就是利润。","plain":"每送一个包裹收一份钱，单价极低但量极大。成本每降一分都是利润。","analogy":"像捡钢镚，一个一分钱，一天捡一百万个。","watch":"看单票成本。成本高于单票收入，规模越大亏越多。"},{"id":"throughput-fee","family":"usage","name":"吞吐量收费","formula":"处理量 × 单价","margin":"取决于自然垄断性与定价机制","lever":"吞吐量、利用率、费率","industries":["log-port","log-pipeline"],"fail":"吞吐量下滑或费率被监管下调","cases":["港口装卸","管道输送","电网输配"],"risk":["量、费率、政策"],"note":"按过货量收过路费，位置垄断决定定价权。","plain":"按过货量收过路费。港口、管道、电网都是这个模式，位置垄断决定定价权。","analogy":"像高速公路收费站，车过得越多收得越多，路还是那条路。","watch":"看吞吐量和费率政策。量跌或价被管，收入直接下滑。"},{"id":"treatment-fee","family":"usage","name":"处理服务费","formula":"处理量 × 单价","margin":"毛利率 25%–40%","lever":"处理量、产能利用率、技术成本","industries":["pub-waste"],"fail":"进料不足或补贴拖欠，产能空转即亏损","cases":["垃圾焚烧","污水处理","危废处置"],"risk":["进料、补贴、政策"],"note":"替社会处理废弃物收费，特许经营是壁垒。","plain":"替社会处理废弃物，按处理量收费。特许经营权是最大壁垒。","analogy":"像城市的「消化系统」，垃圾必须送我这，按吨付钱。","watch":"看进料量和补贴回款。没垃圾处理或补贴拖欠，产能就空转。"},{"id":"utility-tariff","family":"usage","name":"公用事业价","formula":"用量 × 管制价格","margin":"受管制，稳定但上限明确","lever":"用量增长、成本控制、顺价机制","industries":["mine-oilgas","mine-salt","pub-power","pub-gas-water"],"fail":"成本上升无法顺价，价差被压缩","cases":["自来水","燃气","电力零售"],"risk":["政策、成本、量"],"note":"按表收费的民生必需品，政府定价，胜在稳定。","plain":"按表收费的民生必需品，政府定价。胜在稳定，输在没有涨价空间。","analogy":"像自来水，价格政府定，你只能用这家。","watch":"看购销价差和顺价机制。成本涨了但价格不能涨，就亏。"},{"id":"toll-road","family":"usage","name":"通行费","formula":"车流量 × 费率","margin":"毛利率 50%–70%，折旧是主要成本","lever":"车流量、费率、运营成本","industries":["re-infra"],"fail":"车流量不及预期或特许期届满资产移交","cases":["高速公路","桥梁","隧道"],"risk":["流量、政策、特许期"],"note":"收过路费的长期资产，类债券现金流。","plain":"路修好了，收过路费。特许期结束无偿交给政府，期间是稳定的现金牛。","analogy":"像买了一只 30 年期债券，每年付息，到期本金归零。","watch":"看车流量和剩余特许年限。年限越短，价值越低。"},{"id":"parking-fee","family":"usage","name":"停车费","formula":"车位 × 周转 × 单价","margin":"毛利率 40%–60%","lever":"车位资源、周转率、位置","industries":["re-property"],"fail":"周边供给增加或周转下降","cases":["停车场","路侧停车","立体车库"],"risk":["位置、竞争、政策"],"note":"卖时间和空间，位置是唯一核心资产。","plain":"卖时间和空间。车位位置越好、周转越快，赚得越多。","analogy":"像机场停车，按小时收，停越久越贵，位置决定价格。","watch":"看周转率和位置。好位置一个顶十个差位置。"},{"id":"power-generation-margin","family":"usage","name":"发电价差","formula":"上网电价 − 度电成本","margin":"度电毛利 0.02–0.15 元","lever":"利用小时、燃料成本、电价机制","industries":["mfg-pv","tech-clean-tech","pub-power"],"fail":"燃料涨价或电价下调，利用小时再降则亏损","cases":["煤电","水电","光伏电站"],"risk":["燃料、政策、来水"],"note":"电价市场化加容量电价机制，储能从配套变为独立盈利主体。","plain":"发电卖电，收入减燃料、折旧、人工。利用小时数决定生死。","analogy":"像工厂机器，开着才产出，停着照样折旧。","watch":"看利用小时和度电成本。机器一年开多少小时，直接决定赚不赚。"},{"id":"ancillary-service","family":"usage","name":"辅助服务收益","formula":"调节能力 × 补偿价格","margin":"单位收益高，规模小","lever":"调节速度、可用容量、市场规则","industries":["pub-power","public-tourism"],"fail":"市场规则变化或新能源自带调节能力削弱需求","cases":["储能调频","需求响应","虚拟电厂"],"risk":["规则、竞争、技术"],"note":"电网为稳定付费，卖的是灵活调节能力。","plain":"电网为了稳定，为能快速调节的设施付费。储能、虚拟电厂赚这个钱。","analogy":"像消防队，平时没事干，关键时刻能上就值钱。","watch":"看调节速度和市场规则。规则一变，这个收入可能归零。"},{"id":"green-power-trading","family":"usage","name":"绿电绿证交易","formula":"绿电量 × 环境溢价","margin":"溢价 0.01–0.05 元每千瓦时","lever":"绿电供给、消纳责任、企业需求","industries":["pub-power"],"fail":"政策消纳权重不达预期或供给过剩","cases":["绿电交易","绿证","PPA"],"risk":["政策、供给、需求"],"note":"把环境属性单独卖钱，政策创造的市场。","plain":"把「绿色」这个属性单独拆出来卖。用了绿电的企业愿意为环保属性付溢价。","analogy":"像有机蔬菜，成分差不多，但「有机」这个标签值钱。","watch":"看政策消纳权重。权重不达标，这个市场就起不来。"},{"id":"per-word-fee","family":"usage","name":"按字数计费","formula":"字数 × 单价","margin":"毛利率 30%–50%","lever":"单价、译员效率、AI 替代","industries":["srv-translation"],"fail":"机器翻译把单价压到无法覆盖质检成本","cases":["翻译公司","本地化服务"],"risk":["AI 替代、价格、质量"],"note":"按产出量收费，正被 AI 快速压缩。","plain":"按字数收费，翻多少字收多少钱。AI 翻译正在把这个模式打穿。","analogy":"像按件计价的车衣，件数越多钱越多，但单价越来越低。","watch":"看单价和 AI 替代速度。通用文本的单价已经在崩。"},{"id":"per-item-fee","family":"usage","name":"按件计费","formula":"件数 × 单价","margin":"取决于人工与能耗","lever":"件数、单件成本、设备效率","industries":["srv-laundry"],"fail":"单件成本高于单价，规模扩大亏损扩大","cases":["洗衣","洗涤","打印"],"risk":["成本、需求"],"note":"按件收加工费，设备与人效决定毛利。","plain":"按件收加工费。设备和人工效率决定利润。","analogy":"像洗衣店，洗一件收一件的钱，水电人工是成本。","watch":"看单件成本和设备利用率。机器闲着就是亏。"},{"id":"per-ton-fee","family":"usage","name":"按吨收费","formula":"吨数 × 单价","margin":"毛利率 20%–40%","lever":"处理量、单位成本、合规","industries":["srv-cleaning"],"fail":"处理量下滑或单位成本上升","cases":["环卫清运","渣土","饲料加工"],"risk":["量、成本、政策"],"note":"按重量收费的粗活，规模和效率决定利润。","plain":"按重量收费的粗活，量大但单价低，规模和效率是唯一出路。","analogy":"像收废品，一吨赚几十块，一天走几十吨。","watch":"看处理量和单位成本。这是最典型的规模生意。"},{"id":"handling-fee","family":"usage","name":"操作处理费","formula":"操作量 × 单价","margin":"毛利率 25%–45%","lever":"操作量、自动化、效率","industries":["log-warehouse","public-aviation-service"],"fail":"操作量下降或人工成本上升","cases":["仓储操作","机场地服","货物处理"],"risk":["量、成本、安全"],"note":"按操作次数或吨位收费，自动化提升人效。","plain":"按操作次数或吨位收操作费。自动化程度决定人效。","analogy":"像快递分拣中心，处理一个包裹收一份操作费。","watch":"看操作量和自动化率。人工占比高的最容易被替代。"},{"id":"postage","family":"usage","name":"邮资","formula":"重量与距离 × 资费","margin":"受普遍服务约束，商业件补贴普遍件","lever":"件数、资费、成本控制","industries":["public-post"],"fail":"信件量持续萎缩，普遍服务成本无法覆盖","cases":["邮政","快递普件"],"risk":["量、成本、政策"],"note":"按重量距离收费的公共服务，政策与市场双重属性。","plain":"按重量和距离收费的公共服务。信件在萎缩，靠快递和金融补贴。","analogy":"像国营老厂，主业不赚钱，靠副业养着。","watch":"看信件量和普遍服务成本。这个业务的社会价值大于经济价值。"},{"id":"tariff","family":"usage","name":"关税","formula":"完税价格 × 税率","margin":"税率由国家设定","lever":"贸易量、税率结构、征管效率","industries":["gov-customs"],"fail":"贸易量萎缩或免税政策扩大","cases":["海关","进口环节税"],"risk":["贸易、政策"],"note":"国家按货值收税，贸易流量决定收入。","plain":"国家按货值收税，贸易流量决定收入。","analogy":"像城门收过路费，货过得越勤、越值钱，收得越多。","watch":"看贸易量和税率结构。贸易战一打，这个收入就抖。"},{"id":"vending-machine","family":"usage","name":"自动售货收入","formula":"单机日销 × 点数 − 补货成本","margin":"毛利率 40%–60%","lever":"点位质量、单机日销、补货成本","industries":["retail-vending","srv-laundry"],"fail":"点位成本高企或单机日销不足","cases":["饮料售货机","智能货柜","盲盒机"],"risk":["点位、设备、需求"],"note":"点位垄断加被动消费，无人化赚服务差价。","plain":"把货放在人流处自动卖，点位就是一切。无人化赚的是服务差价。","analogy":"像自动取款机，占着好位置，人来自助，你不用管。","watch":"看单机日销和点位成本。点位差的机器是赔钱货。"},{"id":"gaming-iap","family":"usage","name":"游戏内购","formula":"付费用户 × ARPPU","margin":"毛利率 60%–85%，渠道分成后下降","lever":"付费率、ARPPU、留存、玩法深度","industries":["tech-game"],"fail":"付费设计失衡导致留存崩塌，或监管限制抽卡","cases":["手游","端游","主机游戏"],"risk":["监管、留存、竞争"],"note":"少数高付费用户养活多数免费用户，是注意力的极致变现。","plain":"游戏免费给你玩，但想变强就得付费。少数土豪养活大多数免费玩家。","analogy":"像酒吧，女生免费进场，男生买高价酒水。","watch":"看付费率和 ARPPU。头部玩家流失，收入立刻塌。"},{"id":"gaming-battle-pass","family":"usage","name":"通行证与赛季订阅","formula":"购买数 × 单价","margin":"近乎纯利，边际成本接近零","lever":"活跃玩家、赛季设计、价格锚点","industries":["tech-game"],"fail":"活跃度下滑或奖励设计失去吸引力","cases":["Fortnite","王者荣耀","CS2"],"risk":["活跃度、设计、竞争"],"note":"把订阅制装进游戏，用进度和奖励锁住活跃。","plain":"花一笔小钱买赛季通行证，做任务升级拿奖励。把订阅制装进游戏。","analogy":"像健身房月卡，买了就得常来，来了就持续玩。","watch":"看活跃度和奖励吸引力。活跃度一下降，通行证卖不动。"},{"id":"gambling-house-edge","family":"usage","name":"赌场抽水","formula":"投注额 × 赌场优势","margin":"赌场优势 1%–15%","lever":"流水、赌客数量、赔率设计","industries":[],"fail":"大客赢取超过优势上限，或监管收紧牌照","cases":["赌场","彩票","体育博彩"],"risk":["监管、赔付波动、牌照"],"note":"靠概率优势长期抽水，流水越大利润越稳。","plain":"赔率设计上占一点优势，长期靠大数定律稳赚。流水越大利润越稳。","analogy":"像抛硬币但你抽 5% 水，抛一万次你一定赚。","watch":"看流水和优势幅度。优势被抹平，庄家也亏。"},{"id":"box-office-share","family":"usage","name":"票房分账","formula":"票房 − 专项基金与税 − 院线分成","margin":"片方净分账约 33%–43%","lever":"票房、排片、成本控制","industries":["media-film"],"fail":"票房不及成本，或排片被同期挤压","cases":["电影出品方","院线"],"risk":["票房、排片、审查"],"note":"票房越高赚越多，但高度集中在少数爆款。","plain":"票房扣掉税费和院线分成后，剩下的归片方。爆款通吃，多数亏损。","analogy":"像买彩票，中大奖的覆盖所有没中的。","watch":"看票房和成本回收。这是最典型的爆款驱动生意。"},{"id":"live-ticketing","family":"usage","name":"票务收入","formula":"票价 × 售票数 − 成本","margin":"毛利率 20%–50%","lever":"上座率、票价、供给稀缺","industries":["media-music","media-esports","media-theme-park"],"fail":"上座率不足或退票与不可抗力","cases":["演唱会","体育赛事","景区门票"],"risk":["上座率、不可抗力、成本"],"note":"一次性事件变现，稀缺供给决定票价弹性。","plain":"一次性事件变现，卖一张少一张。稀缺性决定票价弹性。","analogy":"像演唱会的票，位置就那么多，需求大就涨价。","watch":"看上座率和不可抗力。一场疫情或天气就能让全部归零。"},{"id":"ticketing","family":"usage","name":"平台票务佣金","formula":"票款 × 佣金率","margin":"佣金率 5%–20%","lever":"票量、流量、独家资源","industries":["public-tourism"],"fail":"主办方直销绕过平台，或黄牛与监管冲击","cases":["大麦网","Ticketmaster","携程门票"],"risk":["直销化、监管、竞争"],"note":"票务渠道抽成，流量和独家资源是壁垒。","plain":"票务渠道抽成，掌握流量和独家资源就能收佣金。","analogy":"像黄牛但有牌照，官方授权你加价卖。","watch":"看票量和独家资源。主办方一直播，平台就没价值了。"},{"id":"ad-network","family":"attention","name":"广告收入","formula":"展示或点击 × 单价","margin":"毛利率 60%–85%","lever":"流量规模、用户画像精度、广告加载率","industries":["retail-ecommerce","retail-vending","tech-consumer-internet","tech-game","media-shortvideo","media-music","media-publishing","media-content-studio"],"fail":"流量下滑或广告主预算转移，单价崩塌","cases":["Google","字节跳动","Meta"],"risk":["广告周期、流量、监管"],"note":"广告仍是互联网最赚钱的模式，但增量转向本地生活与电商。","plain":"把用户的注意力打包卖给广告主。用户时长乘以广告单价就是收入。","analogy":"像商场，收租给品牌开店，客流越大租金越高。","watch":"看用户时长和广告加载率。时长是天花板，加载率不能无限加。"},{"id":"media-commission","family":"attention","name":"媒介代理返点","formula":"媒介投放额 × 返点率","margin":"返点率 3%–15%","lever":"投放规模、客户结构、垫资能力","industries":["media-advertising"],"fail":"客户预算萎缩或媒介方直客化削减返点","cases":["广告代理","4A 公司"],"risk":["预算、垫资、返点"],"note":"替客户花媒介预算赚返点，规模是唯一门槛。","plain":"替客户花媒介预算，从媒体方拿返点。规模是唯一门槛。","analogy":"像团购买手，帮大家集中采购，从商家拿折扣。","watch":"看投放规模和客户留存。预算一收缩，这个模式最先受伤。"},{"id":"live-gift","family":"attention","name":"直播打赏分成","formula":"打赏额 × 分成比例","margin":"平台分成 30%–50%","lever":"主播供给、用户付费、内容吸引力","industries":["edu-online","tech-consumer-internet","media-shortvideo"],"fail":"头部主播流失或监管限制打赏功能","cases":["直播平台","语音社交"],"risk":["监管、主播、竞争"],"note":"用户为情绪价值付费，主播与平台分成。","plain":"用户为情绪价值打赏，主播和平台分成。","analogy":"像街头卖艺，路人看高兴了扔钱，场子收管理费。","watch":"看头部主播和用户付费。主播一走，收入塌一半。"},{"id":"sponsorship","family":"attention","name":"赞助收入","formula":"赞助金额","margin":"毛利率 70% 以上，边际成本低","lever":"IP 影响力、受众质量、稀缺性","industries":["edu-arts","media-esports","srv-event"],"fail":"IP 热度下滑或受众与品牌错配","cases":["体育赛事","综艺、展会"],"risk":["IP、周期、效果"],"note":"把影响力卖给品牌方，一次赞助长期曝光。","plain":"把影响力和曝光位卖给品牌方。一次赞助，长期曝光。","analogy":"像球队球衣印logo，一场比赛几百万人看。","watch":"看 IP 热度和受众匹配。受众和品牌错配，赞助就不值钱。"},{"id":"brand-endorsement","family":"attention","name":"代言与推广","formula":"代言费","margin":"达人端近乎纯收入","lever":"粉丝量、信任度、转化能力","industries":["mfg-luxury","retail-brand-dtc","retail-category","retail-dutyfree","retail-beauty","retail-luxury","health-tcm","media-content-studio"],"fail":"人设崩塌或带货数据不佳导致报价崩塌","cases":["明星代言","KOL、达人"],"risk":["人设、数据、合规"],"note":"把个人信用借给品牌，风险与收益都极高。","plain":"把个人信用借给品牌，收代言费。风险和收益都极高。","analogy":"像担保，你出名时值钱，塌房时倒赔。","watch":"看人设稳定性。一次丑闻，代言费变赔偿金。"},{"id":"affiliate-commission","family":"attention","name":"联盟分销佣金","formula":"成交额 × 佣金率","margin":"佣金率 3%–50%","lever":"流量质量、选品、转化","industries":["agri-smart", vending","srv-event"],"fail":"参展预算萎缩或展会品牌贬值","cases":["展会、专业市场、美食广场"],"risk":["预算、品牌、周期"],"note":"出租场地和流量位，收租金。","plain":"出租场地和流量位，收租金。","analogy":"像美食广场，档口按月租，生意好坏看位置。","watch":"看客流和空置率。位置差的摊位永远租不出去。"},{"id":"distribution-fee","family":"platform","name":"渠道分销费","formula":"分销额 × 加价率","margin":"分销加价 5%–30%","lever":"渠道覆盖、周转速度、品牌组合","industries":["fin-asset-management"],"fail":"品牌方直营削减渠道价值，或库存积压","cases":["经销商、代理商、药店连锁"],"risk":["库存、直营、账期"],"note":"买货卖货赚差价，渠道价值来自覆盖和垫资。","plain":"买货卖货赚差价，渠道价值来自覆盖和垫资。","analogy":"像批发商，从厂家低价拿，加价卖给小卖部。","watch":"看周转速度和渠道覆盖。周转慢一天，资金成本就吃掉利润。"},{"id":"distribution-margin","family":"platform","name":"经销加价","formula":"售价 − 进价 − 费用","margin":"毛利率 5%–20%","lever":"周转、规模采购、终端覆盖","industries":["agri-planting","agri-livestock","agri-aquaculture","agri-processing","chem-coating","mfg-appliance","mfg-lighting","mfg-textile","mfg-furniture","mfg-gun-metal","mfg-packaging","re-decoration","retail-pharmacy"],"fail":"周转放缓占用资金，或价格倒挂","cases":["快消分销、医药流通"],"risk":["库存、价格、账期"],"note":"低毛利高周转的经典分销生意。","plain":"低毛利高周转的经典分销，规模是唯一护城河。","analogy":"像自来水，一吨赚几分，但一天流几千吨。","watch":"看周转天数和库存。库存积压是分销的死因。"},{"id":"procurement-scale","family":"platform","name":"集采规模差价","formula":"零售价 − 集采价","margin":"毛利率 10%–25%","lever":"采购规模、品控、履约","industries":["re-construction","log-express"],"fail":"规模不足失去议价权，或品控出事","cases":["Costco、美团快驴、团购"],"risk":["品控、规模、价格"],"note":"集中采购压低进价，再分散卖出赚规模差价。","plain":"集中采购压低进价，再分散卖出赚规模差价。","analogy":"像团购，人多力量大，把价格砍下来。","watch":"看采购规模和品控。规模不够就没有议价权。"},{"id":"franchise-support","family":"platform","name":"加盟支持服务","formula":"加盟费 + 供货 + 服务","margin":"总部端毛利率高","lever":"品牌、单店模型、加盟商存活","industries":[],"fail":"加盟商亏损潮导致品牌和现金流双杀","cases":["连锁餐饮、便利店、教育加盟"],"risk":["加盟商、品牌、法律"],"note":"卖模式和供应链给创业者，靠体系化赚钱。","plain":"卖模式和供应链给创业者，靠体系化赚钱。","analogy":"像连锁加盟，你出品牌和配方，我出钱开店。","watch":"看加盟商存活率和供应链毛利。加盟商亏了，总部也完了。"},{"id":"co-branding","family":"platform","name":"联名与合作分成","formula":"联名收入 × 分成","margin":"毛利率高，边际成本低","lever":"IP 热度、品牌匹配、限量稀缺","industries":[],"fail":"IP 热度透支或合作方品牌受损","cases":["品牌联名、跨界合作"],"risk":["IP、匹配、口碑"],"note":"两个品牌互相借力，用稀缺性制造溢价。","plain":"两个品牌互相借力，用稀缺性制造溢价。","analogy":"像联名球鞋，两个牌子一凑，价格翻几倍。","watch":"看 IP 热度和品牌匹配。硬凑的联名没人买账。"},{"id":"joint-venture-share","family":"platform","name":"合资权益分成","formula":"合资公司利润 × 股比","margin":"取决于项目本身","lever":"资源互补、治理结构、项目选择","industries":["mine-oilgas","gov-military-civil"],"fail":"合作方目标不一致导致治理僵局","cases":["中外合资、产业基金"],"risk":["治理、合作方、项目"],"note":"出资源不出全部钱，按股比分享利润。","plain":"出资源不出全部钱，按股比分享利润。","analogy":"像合伙开饭店，你出配方我出钱，赚了按股分。","watch":"看治理结构和合作方目标。目标不一致，公司就僵死。"},{"id":"concession-revenue","family":"platform","name":"特许经营收益","formula":"经营权 × 经营收益","margin":"取决于特许协议与经营能力","lever":"位置、品牌、运营","industries":["re-infra"],"fail":"经营权成本过高或经营不善","cases":["机场免税、景区索道、高速服务区"],"risk":["位置、协议、经营"],"note":"花钱买下黄金位置的经营权，赚流量生意。","plain":"花钱买下黄金位置的经营权，赚流量生意。","analogy":"像机场免税店，位置垄断，客流巨大。","watch":"看位置价值和经营权成本。位置差了，特许费都赚不回来。"},{"id":"spectrum-license","family":"platform","name":"频谱与牌照价值","formula":"牌照稀缺性 × 市场定价","margin":"牌照本身是准入壁垒","lever":"牌照稀缺、政策、资本","industries":[],"fail":"政策放开准入导致牌照溢价消失","cases":["运营商牌照、支付牌照、典当牌照"],"risk":["政策、准入、资本"],"note":"牌照即生意，稀缺性决定溢价。","plain":"牌照即生意，稀缺性决定溢价。","analogy":"像限量版车牌，号牌稀缺所以贵。","watch":"看牌照稀缺性和政策。准入一放开，溢价就消失。"},{"id":"media-rights","family":"platform","name":"赛事与内容版权","formula":"版权费 × 转播权期限","margin":"取决于版权成本与变现能力","lever":"独家性、受众规模、广告与订阅变现","industries":["media-esports","media-anime","media-copyright"],"fail":"版权成本高于广告与订阅收入，或受众流失","cases":["体育版权、剧集版权、赛事版权"],"risk":["成本、受众、竞争"],"note":"买下独家内容再变现，赌的是注意力价值。","plain":"买下独家内容版权再变现，赌的是注意力价值。","analogy":"像买断独家代理，别人想卖必须经过你。","watch":"看版权成本和受众规模。买贵了或受众跑了，就亏。"},{"id":"professional-hourly","family":"service","name":"按小时计费","formula":"计费小时 × 小时费率","margin":"毛利率 40%–70%","lever":"费率、利用率、杠杆比例","industries":["agri-smart","mfg-additive","re-design","retail-cvs","retail-pharmacy","retail-motherbaby","retail-used","health-cro","health-mental","tech-cyber","fin-banking","fin-investment-bank","fin-pe-vc","fin-insurance-life","fin-insura cases":["健身房、私教工作室"],"risk":["复购、教练、预付"],"note":"卖时间和专业指导，预付费是现金流也是风险。","plain":"卖时间和专业指导，预付费是现金流也是风险。","analogy":"像家教，先买 100 节，上一节扣一节。","watch":"看课消和复购。课卖出去不上，是负债不是收入。"},{"id":"fitness-membership","family":"service","name":"健身会员费","formula":"会员数 × 会费","margin":"毛利率 30%–50%","lever":"活跃会员、续费率、场地利用率","industries":["health-fitness"],"fail":"续费率低导致获客成本无法回收","cases":["健身房、月付制场馆"],"risk":["续费、预付、竞争"],"note":"预收年卡是主要现金流，续费才是真实收入。","plain":"预收会费是主要现金流，续费才是真实收入。","analogy":"像年卡，赌你不常来。常来的人少了，平台才赚。","watch":"看续费率。你赌别人不来，别人赌你跑不了。"},{"id":"long-term-care-insurance","family":"service","name":"长护险结算","formula":"评估等级 × 支付标准","margin":"取决于成本控制与支付标准","lever":"评估准确、服务成本、政策覆盖","industries":["health-eldercare","health-rehab"],"fail":"支付标准低于服务成本，或评估不通过","cases":["长护险定点机构、居家照护"],"risk":["政策、成本、评估"],"note":"保险支付照护费用，机构赚服务差价。","plain":"保险支付照护费用，机构赚服务差价。","analogy":"像医保，保险出钱，服务机构干活收钱。","watch":"看支付标准和成本控制。标准低于成本就亏。"},{"id":"government-subsidy","family":"service","name":"政府补贴","formula":"补贴额度","margin":"非市场化收入","lever":"政策符合度、申报能力、执行合规","industries":["health-eldercare","fin-microfinance","log-rail","gov-civil-affairs","gov-military-civil"],"fail":"政策退坡或申报不符被追回","cases":["农业补贴、新能源补贴、产业扶持"],"risk":["政策、合规"],"note":"政策直接给钱，最不稳定也最容易被砍。","plain":"政策直接给钱，最不稳定也最容易被砍。","analogy":"像补贴，给你时是收入，不给时是空白。","watch":"看政策连续性。这是最不可依赖的收入。"},{"id":"manufacturing-margin","family":"labor","name":"制造加工毛利","formula":"售价 − 料工费","margin":"制造业毛利率 10%–35%","lever":"规模、良率、成本曲线位置","industries":["agri-livestock","agri-processing","mine-oilgas","mine-metal","mine-quarry","mine-salt","chem-basic","chem-fine","mat-steel","mat-nonferrous","mat-cement","mat-glass-ceramic","mfg-auto","mfg-parts","mfg-semi-osat","mfg-machinery","mfg-cnc","mfg-ship","mfg-appliance","mfg-consumer-electronics","mfg-pcb","mfg-display","mfg-pv","mfg-battery","mfg-lighting","mfg-furniture","mfg-gun-metal","mfg-packaging","mfg-fiber","mfg-additive","retail-fnb","retail-beverage","health-hospital","health-pharma","health-generic","health-device","health- g-consumer-electronics","mfg-pcb","mfg-display","mfg-pv","mfg-battery","mfg-lighting","mfg-textile","mfg-furniture","mfg-luxury","mfg-gun-metal","mfg-packaging","mfg-fiber","mfg-instrument","mfg-additive","re-decoration","retail-supermarket","retail-cvs","retail-brand-dtc","retail-category","retail-dutyfree","retail-pharmacy","retail-automotive","retail-beauty","retail-motherbaby","retail-grocery","retail-luxury","retail-used","retail-vending","health-dental","health-device","health-ivd","health-fitness","health-medical-tourism","tech-cyber","tech-device","tech-iot","log-packaging-supply","srv-beauty-salon","srv-wedding","srv-carwash"],"fail":"库存积压或价格战导致售价低于进价","cases":["零售、经销、贸易"],"risk":["库存、价格、周转"],"note":"购销差价是最普遍的商业模式，但在产能过剩行业已无利可图。","plain":"买进来卖出去，最普遍的商业形态，周转是关键。","analogy":"像小卖部，进货卖货，赚差价。","watch":"看库存周转和加价率。库存积压是零售的死因。"},{"id":"private-label","family":"labor","name":"自有品牌产品","formula":"零售价 − 代工成本","margin":"毛利率 30%–50%","lever":"品牌信任、渠道控制、规模","industries":["retail-supermarket","retail-cvs","retail-fnb","retail-beverage","retail-grocery"],"fail":"品质事故摧毁品牌信任","cases":["Costco Kirkland、网易严选、无印良品"],"risk":["品质、品牌、供应链"],"note":"去掉品牌溢价自己生产，性价比是卖点。","plain":"去掉品牌溢价自己生产，性价比是卖点。","analogy":"像 Costco 的自有品牌，同样的东西贴自己的标，便宜卖。","watch":"看品控和渠道控制。品质出事，品牌就毁。"},{"id":"white-label-oem","family":"labor","name":"白牌与贴牌","formula":"贴牌价 − 生产成本","margin":"毛利率 15%–30%","lever":"成本控制、起订量、交付","industries":[],"fail":"同质化价格战或客户拖欠","cases":["白牌家电、白牌美妆、白牌服饰"],"risk":["价格战、账期、同质化"],"note":"没有品牌只卖产品，成本领先是唯一竞争力。","plain":"没有品牌只卖产品，成本领先是唯一竞争力。","analogy":"像白牌家电，没牌子但便宜，靠价格活。","watch":"看成本控制和起订量。价格战一起，这个模式最先死。"},{"id":"print-on-demand","family":"labor","name":"按需印刷生产","formula":"售价 − 单件生产成本","margin":"毛利率 40%–60%","lever":"设计流量、单件成本、长尾覆盖","industries":[],"fail":"流量成本高于单件利润","cases":["定制 T 恤、按需出书、周边定制"],"risk":["流量、库存、质量"],"note":"先卖后造，零库存风险，赚设计与效率差价。","plain":"先卖后造，零库存风险，赚设计与效率差价。","analogy":"像定制 T 恤，有人下单才印，不用囤货。","watch":"看流量成本和单件利润。流量贵过利润就白干。"},{"id":"recycling-margin","family":"labor","name":"再生加工利润","formula":"再生产品价 − 回收与加工成本","margin":"毛利率 10%–25%","lever":"回收网络、加工技术、大宗价格","industries":["mat-nonferrous","retail-used","pub-recycling"],"fail":"大宗价格下跌或回收成本上升","cases":["再生塑料、再生金属、废纸"],"risk":["价格、成本、环保"],"note":"把废料变回原料，赚加工费加大宗价差。","plain":"把废料变回原料，赚加工费加大宗价差。","analogy":"像收废品，收进来分类加工再卖出。","watch":"看大宗价格和回收成本。价格一跌，库存就亏。"},{"id":"consumable-razor-blade","family":"labor","name":"耗材刀片模式","formula":"设备或主体低价 + 耗材持续收入","margin":"耗材毛利率 50%–80%","lever":"装机量、耗材复购率、锁定强度","industries":["health-device","health-ivd","edu-k12","edu-edtech"],"fail":"兼容耗材或第三方替代打破锁定","cases":["打印机墨盒、IVD 试剂、胶囊咖啡"],"risk":["替代、监管、复购"],"note":"剃刀刀片模式在医疗设备与 IVD 最典型，集采正在打破锁定。","plain":"主体便宜甚至白送，靠强制耗材长期收租。","analogy":"像打印机，机器白送，墨盒死贵。","watch":"看装机量和耗材复购率。装机量是存量，复购是流量。"},{"id":"aftermarket-parts","family":"labor","name":"售后配件","formula":"配件价 − 成本","margin":"毛利率 40%–70%","lever":"装机保有量、配件需求率、渠道控制","industries":["mine-service","mfg-auto","mfg-parts","mfg-semi-front","mfg-machinery","mfg-cnc","mfg-defense","mfg-rail","mfg-aviation","mfg-appliance","mfg-consumer-electronics","mfg-luxury","mfg-instrument","re-crane","retail-automotive","srv-repair"],"fail":"装机量萎缩或副厂件冲击","cases":["汽车配件、工程机械配件、设备备件"],"risk":["装机量、副厂、价格"],"note":"设备保有量就是存量的印钞机，配件是主要利润。","plain":"设备保有量就是存量的印钞机，配件是主要利润。","analogy":"像汽车 4S 店，卖车不赚，保养维修赚。","watch":"看装机保有量和配件需求率。保有量一下滑，售后就断粮。"},{"id":"api-export","family":"labor","name":"原料药出口","formula":"出口价 − 成本","margin":"毛利率 20%–40%，周期波动大","lever":"成本、认证、客户","industries":["health-generic"],"fail":"价格战或环保停产导致成本失控","cases":["原料药、中间体出口"],"risk":["价格、环保、认证"],"note":"卖基础原料给全球制药，成本与认证是壁垒。","plain":"卖基础原料给全球制药，成本与认证是壁垒。","analogy":"像面粉厂，卖给全城的面包店。","watch":"看成本和认证资质。环保一停产，成本就失控。"},{"id":"b2b-contract","family":"labor","name":"企业合约供应","formula":"合约额 − 成本","margin":"毛利率 15%–30%","lever":"合约稳定性、成本控制、服务","industries":["srv-laundry","srv-carwash","pub-recycling"],"fail":"客户流失或成本上升","cases":["团餐供应、布草洗涤、耗材供应"],"risk":["客户、成本、账期"],"note":"长期供货合约，稳定但利润受成本挤压。","plain":"长期供货合约，稳定但利润受成本挤压。","analogy":"像单位食堂承包，签长期合同，赚管理差价。","watch":"看合约稳定性和成本控制。成本涨合约价不涨就亏。"},{"id":"licensing-royalty","family":"license","name":"授权金与版税","formula":"授权费 + 销售额 × 版税率","margin":"首付款通常仅占潜在总额 5% 左右，里程碑与销售分成占大头但兑现率低","lever":"IP 价值、授权广度、品控","industries":["agri-seed","mine-rare-earth","chem-fine","mat-new","chem-coating","mfg-semi-front","mfg-semi-design","mfg-instrument","re-design","health-pharma","health-biotech","health-tcm","edu-library","tech-game","tech-device","tech-quantum","media-music","media-copyright"],"fail":"IP 热度下滑或授权泛滥导致贬值","cases":["迪士尼授权、专利许可、品牌授权"],"risk":["IP、品控、合同"],"note":"创新药 BD 让授权模式成为中国药企的核心造血引擎。","plain":"把无形资产租出去，一次创造长期收租。","analogy":"像房东，房子建一次，租一辈子。","watch":"看 IP 热度和授权广度。IP 过气，授权收入就归零。"},{"id":"ip-licensing","family":"license","name":"IP 授权","formula":"授权金 + 分成","margin":"毛利率 80% 以上","lever":"IP 热度、衍生品开发、渠道","industries":["mfg-semi-design","media-anime","media-copyright"],"fail":"IP 生命周期结束或衍生品滞销","cases":["三丽鸥、宝可梦、Line Friends"],"risk":["IP、库存、周期"],"note":"形象和故事是资产，授权给全产业链变现。","plain":"形象和故事是资产，授权给全产业链变现。","analogy":"像米老鼠，迪士尼自己不生产玩具，授权给别人收钱。","watch":"看 IP 生命周期。一个 IP 的热度是有期限的。"},{"id":"ip-adaptation","family":"license","name":"改编权收入","formula":"改编授权费","margin":"取决于原作价值","lever":"原作热度、改编质量、IP 运营","industries":["edu-library","media-film","media-copyright"],"fail":"改编失败反噬原作口碑","cases":["小说改编影视、游戏改编、漫画改编"],"risk":["改编、口碑、版权"],"note":"把内容资产搬到另一种媒介，一次授权多次变现。","plain":"把内容资产搬到另一种媒介，一次授权多次变现。","analogy":"像小说改编电影，一本书卖出影视版权。","watch":"看原作热度和改编质量。改砸了反噬原作。"},{"id":"patent-royalty","family":"license","name":"专利许可费","formula":"专利产品销售额 × 费率","margin":"费率 1%–10%，纯利","lever":"专利质量、覆盖范围、执行力","industries":["agri-seed","mine-coal","mine-rare-earth","mat-new","health-pharma","edu-higher"],"fail":"专利被无效或规避设计，许可费归零","cases":["高通、华为、杜邦"],"risk":["无效、规避、诉讼"],"note":"用技术垄断收租，诉讼是最后的手段。","plain":"用技术垄断收租，诉讼是最后的手段。","analogy":"像收过路费，用我的技术就得交钱。","watch":"看专利质量和覆盖范围。被无效或规避，收入归零。"},{"id":"technology-licensing","family":"license","name":"技术授权","formula":"授权费 + 提成","margin":"毛利率 70% 以上","lever":"技术领先性、验证、客户","industries":["tech-clean-tech","gov-military-civil"],"fail":"技术被追赶或客户自研成功","cases":["化工技术授权、工艺许可、CDMO 技术输出"],"risk":["技术、客户、替代"],"note":"卖工艺和 know-how，比卖产品更轻更赚。","plain":"卖工艺和 know-how，比卖产品更轻更赚。","analogy":"像卖配方，你生产我收钱。","watch":"看技术领先性和验证周期。被追平就没了。"},{"id":"royalty-per-chip","family":"license","name":"按芯片抽成","formula":"芯片出货量 × 单颗版税","margin":"毛利率 90% 以上","lever":"IP 复用率、制程节点、客户数","industries":["tech-chip-ecad"],"fail":"客户自研 IP 或制程变化导致 IP 失效","cases":["ARM、EDA IP、接口 IP"],"risk":["自研、制程、竞争"],"note":"每卖一颗芯片就收一次钱，最优质的复利资产。","plain":"每卖一颗芯片就收一次钱，最优质的复利资产。","analogy":"像版税，书卖一本抽一本。","watch":"看 IP 复用率和制程节点。制程变化可能让 IP 失效。"},{"id":"franchise-licensing","family":"license","name":"品牌加盟授权","formula":"加盟费 + 权益金","margin":"总部端毛利率 70% 以上","lever":"品牌、单店模型、管控","industries":[],"fail":"加盟商失败潮引发品牌与法律危机","cases":["连锁品牌、教育加盟、酒店加盟"],"risk":["加盟商、品牌、法律"],"note":"把品牌租给创业者，赚加盟费和持续分成。","plain":"把品牌租给创业者，赚加盟费和持续分成。","analogy":"像开分校，用你的名字和教材，收入分成。","watch":"看加盟商存活和品牌管控。管不好，品牌溢价归零。"},{"id":"model-licensing","family":"license","name":"模型授权","formula":"授权费或按量计费","margin":"毛利率 60%–85%","lever":"模型能力、生态、合规","industries":["tech-ai"],"fail":"开源模型追平或算力成本失控","cases":["大模型 API、开源商业版、行业模型"],"risk":["开源、成本、监管"],"note":"把训练好的能力租出去，边际成本主要是推理。","plain":"把训练好的能力租出去，边际成本主要是推理。","analogy":"像租算力，你不用建模型，调用就给钱。","watch":"看模型能力和开源竞争。开源追平，收费就难。"},{"id":"open-source-support","family":"license","name":"开源商业支持","formula":"订阅 + 支持 + 云托管","margin":"毛利率 70%–85%","lever":"开源采用率、企业版功能、云托管","industries":["tech-data"],"fail":"云厂商转售开源产品而不回馈","cases":["MongoDB、Redis、MongoDB Atlas"],"risk":["云厂商、开源、竞争"],"note":"软件免费，服务、托管和企业功能收费。","plain":"软件免费，服务、托管和企业功能收费。","analogy":"像开源乐高，积木白送，说明书和定制收费。","watch":"看开源采用率和云托管。云厂商转售是最狠的。"},{"id":"data-licensing","family":"license","name":"数据授权","formula":"数据订阅费","margin":"毛利率 80% 以上","lever":"数据独占性、更新频率、客户","industries":["re-surveying","fin-credit-rating","public-survey","gov-statistics"],"fail":"数据合规限制或公开数据替代","cases":["征信数据、气象数据、行业数据库"],"risk":["合规、独占、质量"],"note":"卖别人拿不到或懒得整理的数据，边际成本极低。","plain":"卖别人拿不到或懒得整理的数据，边际成本极低。","analogy":"像独家线报，整理好了卖给需要的人。","watch":"看数据独占性和更新频率。公开数据能替代的就不值钱。"},{"id":"cross-border-remittance","family":"license","name":"跨境汇款费","formula":"汇款额 × 费率","margin":"费率 0.5%–3%","lever":"通道、合规牌照、网络","industries":["fin-payment"],"fail":"监管收紧或费率被竞争压平","cases":["西联、跨境支付、稳定币汇款"],"risk":["监管、汇率、竞争"],"note":"跨境搬钱收过路费，牌照和通道是核心。","plain":"跨境搬钱收过路费，牌照和通道是核心。","analogy":"像国际汇款，跨国转钱收手续费。","watch":"看合规牌照和通道成本。监管一收紧，业务就停。"},{"id":"bug-bounty","family":"license","name":"漏洞赏金","formula":"赏金支出换安全改进","margin":"对企业是成本而非收入","lever":"安全水平、社区、预算","industries":[],"fail":"赏金成本失控或漏洞被恶意利用","cases":["漏洞平台、企业 SRC"],"risk":["成本、滥用"],"note":"众包安全问题，用赏金替代部分安全团队成本。","plain":"众包安全问题，对企业是成本而非收入。","analogy":"像悬赏捉虫，找到一个给一笔钱。","watch":"看安全水平和赏金预算。这是支出项，不是利润源。"},{"id":"venture-gain","family":"gambit","name":"风险投资收益","formula":"退出估值 − 投入成本","margin":"倍数可能极高也可能归零","lever":"项目选择、时点、持有期","industries":[],"fail":"项目失败率高，需少数大赢家覆盖多数亏损","cases":["VC、天使投资、成长期投资"],"risk":["项目风险、退出环境、周期"],"note":"投不确定性，赌少数项目超额回报覆盖多数失败。","plain":"投不确定性，赌少数项目超额回报覆盖多数失败。","analogy":"像撒网捕鱼，多数空手，一网大的全回本。","watch":"看项目选择和退出环境。退出不了，账面富贵变不了现。"},{"id":"proprietary-trading","family":"gambit","name":"自营交易","formula":"交易盈亏","margin":"高波动，看策略与风控","lever":"策略、杠杆、风控","industries":["fin-quant-fund"],"fail":"策略失效或风控失效导致巨额亏损","cases":["券商自营、对冲基金、prop trading"],"risk":["市场、模型、杠杆"],"note":"拿自有资金下注，盈亏都自己承担。","plain":"拿自有资金下注，盈亏都自己承担。","analogy":"像自己下场赌博，赢亏都是自己的。","watch":"看策略和风控。一次失控可能亏光。"},{"id":"housing-price-bet","family":"gambit","name":"地产增值押注","formula":"卖出价 − 买入价 − 资金成本","margin":"取决于市场周期与杠杆","lever":"选筹、杠杆、周期判断","industries":[],"fail":"市场下行叠加高杠杆，本金快速亏损","cases":["住宅投资、商办投资、土地储备"],"risk":["周期、杠杆、流动性"],"note":"赌资产价格上涨，杠杆放大收益也放大亏损。","plain":"赌资产价格上涨，杠杆放大收益也放大亏损。","analogy":"像炒房，涨了翻倍赚，跌了爆仓。","watch":"看市场周期和杠杆率。2026 年地产还在调整期，这个赌注风险极高。"},{"id":"insurance-risk-premium","family":"gambit","name":"风险溢价收入","formula":"承担风险的补偿","margin":"长期为正但短期波动巨大","lever":"风险分散、资本充足、定价","industries":[],"fail":"尾部风险集中爆发，资本被一次性击穿","cases":["再保险、巨灾债券、风险自留"],"risk":["尾部风险、集中度、资本"],"note":"替别人承担风险收费，平时稳赚，灾时巨亏。","plain":"替别人承担风险收费，平时稳赚，灾时巨亏。","analogy":"像卖保险，收着保费，一场台风全赔进去。","watch":"看尾部风险集中度。灾难集中爆发，资本一次击穿。"},{"id":"lottery-sweepstakes","family":"gambit","name":"彩票抽成","formula":"销售额 − 奖金 − 发行费","margin":"返奖率约 50%–65%，发行方稳赚","lever":"销售额、玩法设计、渠道","industries":[],"fail":"监管收紧或销售额萎缩","cases":["福彩、体彩、即开票"],"risk":["监管、规模、舆情"],"note":"用概率设计保证长期正收益，本质是情绪税。","plain":"用概率设计保证长期正收益，本质是情绪税。","analogy":"像抽奖，你为好运付费，组织者稳赚。","watch":"看销售额和政策。监管一限，这个生意就缩。"},{"id":"milestone-payment","family":"gambit","name":"里程碑付款","formula":"达成节点 × 付款","margin":"取决于合同结构","lever":"研发进度、合同条款、谈判","industries":["health-pharma","health-cro","health-biotech"],"fail":"按金额计，全球 BD 交易临床前里程碑兑现率约 55%，临床 III 期降至 12%，商业化阶段仅 5%；多数里程碑永远到不了账","cases":["License-out、CRO 合同、政府课题"],"risk":["研发、合同、进度"],"note":"里程碑听起来美好，兑现率却断崖式下降。","plain":"按研发或项目节点分期收款，用进度换现金流。","analogy":"像工程分期付款，盖一层结一层。","watch":"看节点达成率。研发失败，后续拿不到。"},{"id":"government-contract","family":"gambit","name":"政府采购合同","formula":"合同额 − 成本","margin":"毛利率 15%–35%","lever":"资质、关系、交付能力","industries":["mfg-defense","mfg-rail","mfg-aviation","re-infra","re-surveying","edu-edtech","tech-cyber","tech-quantum","srv-cleaning","pub-waste","gov-e-gov","gov-intl-development"],"fail":"预算削减或验收不通过","cases":["政务信息化、国防采购、基建"],"risk":["预算、验收、账期"],"note":"政府项目稳定但账期长，信创与数据要素是新增量。","plain":"政府买单的项目，稳定但周期长、账期慢。","analogy":"像接政府工程，钱稳但要得久。","watch":"看预算和验收。预算一砍或验收不过，就麻烦。"},{"id":"defense-contract","family":"gambit","name":"军品订单","formula":"订单额 − 成本","margin":"受审价机制约束","lever":"型号周期、资质、产能","industries":["mfg-defense","public-defense","gov-military-civil"],"fail":"型号终止或审价大幅压缩利润","cases":["军工企业、国防配套"],"risk":["型号、审价、周期"],"note":"按型号周期供货，进入配套体系后订单稳定。","plain":"按型号周期供货，进入配套体系后订单稳定。","analogy":"像指定供应商，进了名单就年年有单。","watch":"看型号周期和审价。型号终止或审价压价，利润就薄。"},{"id":"subsidy-grant","family":"gambit","name":"补贴与拨款","formula":"补贴额度","margin":"非经营性收入","lever":"政策匹配、申报、执行","industries":["agri-planting","agri-forestry"],"fail":"政策退坡或审计追回",
