ever":"内容质量、订阅数、留存","industries":[],"fail":"内容质量下滑或免费替代","cases":["Substack、付费 newsletter"],"risk":["质量、留存"],"note":"用专业内容建立付费墙，创作者直接变现。","plain":"用专业内容建立付费墙，创作者直接变现。","analogy":"像付费专栏，订阅才能看。","watch":"看内容质量和订阅留存。质量降就退订。"},{"id":"course-community-fee","family":"gambit","name":"课程社群费","formula":"社群规模 × 年费","margin":"毛利率 60%–80%","lever":"内容、社群氛围、留存","industries":[],"fail":"社群活跃度下降或免费替代","cases":["知识星球、付费社群"],"risk":["活跃度、替代"],"note":"把课程变成持续陪伴的社群，续费是核心。","plain":"把课程变成持续陪伴的社群，续费是核心。","analogy":"像学习小组，买课进群，续费留群。","watch":"看社群活跃度和续费。群冷了人就走。"},{"id":"live-stream-subscription","family":"gambit","name":"直播订阅","formula":"订阅数 × 月费","margin":"毛利率 60%–80%","lever":"主播、内容、留存","industries":[],"fail":"主播流失或内容同质化","cases":["直播会员、付费直播间"],"risk":["主播、留存"],"note":"把直播变成订阅制，粉丝为持续内容付费。","plain":"把直播变成订阅制，粉丝为持续内容付费。","analogy":"像包月直播间，月月付月月看。","watch":"看主播和留存。主播走人就散。"},{"id":"virtual-goods","family":"gambit","name":"虚拟商品销售","formula":"虚拟商品 × 单价","margin":"毛利率 90% 以上","lever":"用户规模、付费率、稀缺设计","industries":[],"fail":"用户流失或监管限制虚拟交易","cases":["游戏皮肤、虚拟道具、数字藏品"],"risk":["监管、用户"],"note":"卖无成本的数字商品，是利润率最高的生意。","plain":"卖无成本的数字商品，是利润率最高的生意。","analogy":"像游戏皮肤，一份代码复制无数份。","watch":"看用户规模和付费率。监管限制虚拟交易是风险。"},{"id":"digital-collectible","family":"gambit","name":"数字藏品","formula":"藏品单价 × 销量","margin":"毛利率 80% 以上","lever":"IP、稀缺性、合规","industries":[],"fail":"监管禁止或市场泡沫破裂","cases":["数字藏品平台、NFT"],"risk":["监管、泡沫"],"note":"卖数字稀缺性，合规风险极高。","plain":"卖数字稀缺性，合规风险极高。","analogy":"像数字版限量邮票，稀缺但监管盯着。","watch":"看合规和泡沫。政策禁或泡沫破就归零。"},{"id":"esports-tournament","family":"gambit","name":"电竞赛事收入","formula":"奖金池 + 赞助 + 版权","margin":"赛事端毛利取决于成本控制","lever":"IP、观众、赞助","industries":[],"fail":"观众流失或赞助收缩","cases":["电竞赛事、联赛、第三方赛事"],"risk":["观众、赞助"],"note":"办比赛赚钱，IP 和观众规模是核心。","plain":"办比赛赚钱，IP 和观众规模是核心。","analogy":"像办运动会，赞助和门票是收入。","watch":"看观众和赞助。没人看就办不下去。"},{"id":"theme-park-ticket","family":"gambit","name":"主题乐园门票","formula":"客流 × 客单价","margin":"取决于折旧与运营成本","lever":"客流、二次消费、IP","industries":[],"fail":"客流下滑或重资产折旧压力","cases":["迪士尼、环球影城、欢乐谷"],"risk":["客流、折旧"],"note":"卖体验，重资产高折旧，二次消费提升利润。","plain":"卖体验，重资产高折旧，二次消费提升利润。","analogy":"像迪士尼，门票之外消费更大。","watch":"看客流和二次消费。客流降就亏折旧。"},{"id":"attraction-ticket","family":"gambit","name":"景区门票","formula":"客流 × 票价","margin":"自然景区毛利率极高","lever":"资源稀缺性、客流、配套","industries":[],"fail":"客流下降或门票降价政策","cases":["黄山、九寨沟、故宫"],"risk":["客流、政策"],"note":"垄断性自然资源变现，是现金牛生意。","plain":"垄断性自然资源变现，是现金牛生意。","analogy":"像黄山，山就那一座，想看就得来。","watch":"看客流和门票政策。降价政策压收入。"},{"id":"scenic-transport","family":"gambit","name":"景区交通","formula":"客运量 × 票价","margin":"毛利率 40%–60%","lever":"客流、垄断性、成本","industries":[],"fail":"客流下降或替代交通","cases":["索道、景区观光车、游船"],"risk":["客流、安全"],"note":"景区内的垄断交通，客流决定收入。","plain":"景区内的垄断交通，客流决定收入。","analogy":"像景区缆车，上山必须坐。","watch":"看客流和安全。安全事故是致命风险。"},{"id":"exhibition-service","family":"gambit","name":"展会服务收入","formula":"服务项目 × 收费","margin":"毛利率 40%–60%","lever":"展会品牌、参展商、服务","industries":[],"fail":"展会品牌贬值","cases":["展具租赁、搭建、注册服务"],"risk":["品牌、周期"],"note":"围绕展会生态的服务收费。","plain":"围绕展会生态的服务收费。","analogy":"像展会搭建商，参展就得搭展台。","watch":"看展会品牌和参展商数。展会不行就没单。"},{"id":"conference-fee","family":"gambit","name":"会议费","formula":"参会人数 × 票价","margin":"毛利率 40%–60%","lever":"会议品牌、议题、演讲者","industries":[],"fail":"参会人数不足或议题同质化","cases":["行业峰会、学术会议、培训会"],"risk":["人数、议题"],"note":"卖知识和人脉，讲者和议题质量定价。","plain":"卖知识和人脉，讲者和议题质量定价。","analogy":"像行业大会，听大佬讲收门票。","watch":"看参会人数和议题。议题同质化就没人来。"},{"id":"sports-event-revenue","family":"gambit","name":"体育赛事收入","formula":"版权 + 赞助 + 门票","margin":"取决于成本与变现","lever":"赛事 IP、观众、商业开发","industries":[],"fail":"赛事停摆或赞助收缩","cases":["职业联赛、马拉松、公开赛"],"risk":["停摆、赞助"],"note":"卖比赛，IP 和观众规模决定商业价值。","plain":"卖比赛，IP 和观众规模决定商业价值。","analogy":"像职业联赛，转播加赞助加门票。","watch":"看赛事 IP 和赞助。停摆或赞助收缩就冷。"},{"id":"club-membership","family":"gambit","name":"俱乐部会员费","formula":"会员数 × 年费","margin":"毛利率 50%–70%","lever":"会员数、权益、留存","industries":[],"fail":"权益价值感不足导致退会","cases":["高尔夫俱乐部、商务会所、车主俱乐部"],"risk":["留存、成本"],"note":"卖身份和圈层，社交属性定价。","plain":"卖身份和圈层，社交属性定价。","analogy":"像高端会所，付会费买圈子。","watch":"看会员数和权益。权益不够就退会。"},{"id":"gym-membership","family":"gambit","name":"健身房会费","formula":"会员数 × 会费","margin":"取决于续费率与利用率","lever":"续费率、活跃度、场地利用率","industries":[],"fail":"续费率低导致预付现金流不可持续","cases":["健身连锁、月付健身房、智能健身房"],"risk":["续费、预付"],"note":"预收会费是现金流，续费才是真实收入。","plain":"预收会费是现金流，续费才是真实收入。","analogy":"像年卡，赌你不常来。","watch":"看续费率。你赌别人不来，别人赌你跑不了。"},{"id":"sports-facility","family":"gambit","name":"场馆运营收入","formula":"场地 × 使用费","margin":"取决于利用率","lever":"利用率、位置、时段定价","industries":[],"fail":"利用率不足或维护成本高","cases":["体育场馆、羽毛球馆、游泳馆"],"risk":["利用率、维护"],"note":"出租场地和时间，利用率决定盈亏。","plain":"出租场地和时间，利用率决定盈亏。","analogy":"像球场，按小时租，空着就亏。","watch":"看利用率。这是唯一的核心指标。"},{"id":"sports-training","family":"gambit","name":"体育培训费","formula":"学员 × 课时费","margin":"毛利率 40%–60%","lever":"学员数、续费、教练","industries":[],"fail":"学员流失或教练产能不足","cases":["青少年体育培训、篮球足球培训"],"risk":["学员、教练"],"note":"卖运动技能培训，刚需化趋势明显。","plain":"卖运动技能培训，刚需化趋势明显。","analogy":"像篮球班，家长为孩子升学付费。","watch":"看学员数和续费。学员流失就断收入。"},{"id":"cultural-performance","family":"gambit","name":"演出收入","formula":"票房 + 赞助 + 版权","margin":"取决于成本与票房","lever":"IP、票价、上座率","industries":[],"fail":"票房不佳或成本失控","cases":["话剧、音乐剧、演唱会"],"risk":["票房、成本"],"note":"卖现场体验，IP 和口碑决定票房。","plain":"卖现场体验，IP 和口碑决定票房。","analogy":"像话剧，口碑好才有人买票。","watch":"看票房和成本。票房不佳就亏。"},{"id":"museum-revenue","family":"gambit","name":"博物馆收入","formula":"门票 + 文创 + 特展","margin":"取决于政策与运营","lever":"藏品、客流、文创开发","industries":[],"fail":"政策免费开放或客流不足","cases":["公立博物馆、私立博物馆、特展"],"risk":["政策、客流"],"note":"公共属性加商业运营，文创是主要增量。","plain":"公共属性加商业运营，文创是主要增量。","analogy":"像博物馆，门票便宜，文创赚钱。","watch":"看客流和文创开发。免费政策压门票收入。"},{"id":"library-service","family":"gambit","name":"图书馆服务","formula":"财政 + 服务收费","margin":"公共属性","lever":"财政、服务创新","industries":[],"fail":"预算削减","cases":["公共图书馆、高校图书馆、专业图书馆"],"risk":["预算"],"note":"公共服务，正通过空间和活动创新增加收入。","plain":"公共服务，正通过空间和活动创新增加收入。","analogy":"像图书馆，免费看书，活动和空间收费。","watch":"看财政和服务创新。预算砍就难。"},{"id":"cultural-tourism","family":"gambit","name":"文化旅游收入","formula":"旅游产品 × 客单价","margin":"毛利率 30%–50%","lever":"文化 IP、客流、产品","industries":[],"fail":"客流下降或产品同质化","cases":["古镇游、文化研学、非遗体验"],"risk":["客流、同质化"],"note":"把文化变成旅游产品，体验和故事定价。","plain":"把文化变成旅游产品，体验和故事定价。","analogy":"像古镇游，卖的是文化和氛围。","watch":"看客流和产品同质化。都一样就没人来。"},{"id":"religious-service","family":"gambit","name":"宗教场所收入","formula":"捐赠 + 服务 + 文创","margin":"取决于管理与政策","lever":"信众、管理、政策","industries":[],"fail":"政策限制或信众减少","cases":["寺庙、道观、宗教场所"],"risk":["政策、舆情"],"note":"信众捐赠和服务收入，受严格政策约束。","plain":"信众捐赠和服务收入，受严格政策约束。","analogy":"像寺庙香火，信众自愿捐。","watch":"看信众和政策。政策限就难。"},{"id":"charity-lottery","family":"gambit","name":"公益彩票","formula":"销售额 − 奖金 − 公益金","margin":"返奖率约 50%–65%","lever":"销售额、玩法、渠道","industries":[],"fail":"监管收紧或销售额萎缩","cases":["福彩、体彩"],"risk":["监管、规模"],"note":"用彩票筹集公益金，概率设计保证正收益。","plain":"用彩票筹集公益金，概率设计保证正收益。","analogy":"像抽奖做公益，买的人是做慈善碰运气。","watch":"看销售额和监管。监管收紧就缩。"},{"id":"sports-lottery","family":"gambit","name":"体育彩票","formula":"销售额 − 奖金 − 发行费","margin":"返奖率约 50%–65%","lever":"销售额、赛事、玩法","industries":[],"fail":"赛事停摆或监管收紧","cases":["竞彩、足彩、北单"],"risk":["赛事、监管"],"note":"围绕体育赛事的竞猜，赛事热度决定销量。","plain":"围绕体育赛事的竞猜，赛事热度决定销量。","analogy":"像赌球，有比赛才有人买。","watch":"看赛事和监管。赛事停或监管限就冷。"},{"id":"welfare-lottery","family":"gambit","name":"福利彩票","formula":"销售额 − 奖金 − 公益金","margin":"返奖率约 50%–65%","lever":"销售额、玩法、渠道","industries":[],"fail":"监管收紧或销售额萎缩","cases":["双色球、刮刮乐、福彩 3D"],"risk":["监管、规模"],"note":"即开和摇号类彩票，稳定但受政策强约束。","plain":"即开和摇号类彩票，稳定但受政策强约束。","analogy":"像刮刮乐，即买即开。","watch":"看销售额和政策。政策是最大变量。"}];
window.ATLAS_GUIDE = {"intro":{"title":"市场是怎么运转的","body":["你每天买菜、点外卖、看病、上班，这些行为背后都是一门生意。理解这些生意怎么赚钱，就是理解市场。","任何一门生意，拆开来看都只有三个问题：卖什么、卖给谁、怎么收钱。这个知识库把这三个问题拆成了三样可以查的东西——行业、盈利模式、岗位。","行业回答「这是什么买卖」。同样是做饭，在家做不要钱，开餐馆就是餐饮业，做成预制菜卖给超市就是食品加工业。行业不同，玩法完全不同。","盈利模式回答「钱怎么进口袋」。房租、工资、会员费、广告费、抽成、卖货差价，收钱的方式决定了这门生意的脾气——有的细水长流，有的大起大落。","岗位回答「谁来干这些活」。一门生意需要有人研发、生产、销售、服务，每个岗位要的能力不一样，拿的钱也不一样。","把这三样拼起来，你就能看懂任何一个行业：它的钱从哪来、经过哪些人的手、最后以什么方式收回来。"]},"steps":[{"n":"1","t":"先看行业怎么赚钱","d":"点任意一张行业卡片。详情页最上面有一句话讲清这个行业靠什么赚钱，下面是六维评分、价值链、钱从哪来到哪去。新手先读这一句话就够了。"},{"n":"2","t":"再点进去看盈利模式","d":"行业详情页里有一排「盈利模式」标签，点任意一个。这里会告诉你这个模式怎么收钱、毛利有多少、什么情况下会失效。失效条件是最重要的——它告诉你这门生意什么时候会亏。"},{"n":"3","t":"然后看是谁在干","d":"行业详情页里还有一排「关键岗位」标签。点进去能看到这个岗位要什么能力、拿多少钱、发展方向是什么、AI 会不会取代它。"},{"n":"4","t":"最后看当期实况","d":"详情页底部如果有「当期实况」块，说明这个行业最近有值得注意的变化——价格涨跌、政策出台、盈亏状况。这是 2026 年当下的真实数据。"}],"faq":[{"q":"毛利率高是不是就一定赚钱？","a":"不一定。毛利率只算「卖价减去直接成本」，还没扣房租、工资、营销、研发这些费用。很多行业毛利率很高但不赚钱，比如餐饮毛利率看着有 60%，扣完成本只剩 3%–5%。也有毛利率低但很赚钱的，比如超市毛利只有 20% 左右，靠超快周转和大规模照样赚。看一个行业赚不赚钱，要同时看毛利、周转和费用。"},{"q":"为什么有的行业增长分很低，反而值得关注？","a":"增长分衡量的是「行业扩张速度」，不是「好不好」。煤炭增长慢，但需求稳定、现金流好、分红高，适合求稳的人。芯片增长快，但投入大、周期波动剧烈、技术路线说变就变。增长慢的行业往往竞争格局已定，活下来的都是强者；增长快的行业机会多，但死得也快。关键看你求什么。"},{"q":"资本密集度是什么意思？跟我有什么关系？","a":"资本密集度衡量「开这个行业要投多少钱」。5 分意味着没有几十亿进不来，比如晶圆厂、机场、港口。1 分意味着几乎不用投钱就能干，比如咨询、设计、内容创作。这个分数直接决定了创业门槛，也决定了这个行业的利润是给资本还是给能力。资本密集度高的行业，利润大多被设备和场地吃掉；资本密集度低的行业，利润归人。"},{"q":"盈利模式有 262 种，我要全看吗？","a":"不用。262 种里大部分是同一个逻辑的变体。新手先看 10 个模式族（左侧筛选），每个族点开头两三个看懂，就能覆盖市场上八成以上的生意。看腻了再往下翻。真正值得记住的是「失效条件」——同一种模式在不同行业失效的方式完全不同。"},{"q":"薪酬数字准吗？我能照着找工作吗？","a":"薪酬是一线城市参考区间，来自前程无忧等机构的调研数据，反映的是市场大致水平，不是你谈判的底牌。同一个岗位在不同公司、不同年份能差一倍以上。用这些数字判断「这个行业整体给钱大方还是小气」是可以的，用它决定「我该要多少」不够。"},{"q":"AI 影响那一栏说我会不会被取代，靠谱吗？","a":"那是我根据 2026 年已发生的替代数据写的判断，不是预言。已确认的趋势是：标准化、流程固定、输入输出明确的白领工作被替代得最快——基础财务核算替代率超 85%、数据录入超 92%、初级程序员 87%、法律文书 92%。反过来，需要动手、面对面、临场判断、承担结果的工作反而更安全。这一栏的价值不在预测，在告诉你哪些能力正在贬值。"},{"q":"当期实况是什么？为什么有的行业没有？","a":"「当期实况」是 2026 年 10 月这个时点的真实数据——价格、盈亏、政策、份额。我检索了大量公开报告和行业数据，只对变化明显或反差大的行业写这一块。没有这一块的行业，说明它当下的状况和它一贯的结构性特征差别不大，读上面那段话就够了。"},{"q":"我想创业 / 转行，该从哪看起？","a":"先确定你的约束条件：有多少本钱、能承受多大风险、有什么能力。然后按资本密集度筛行业——钱少就别看 5 分的。再看「失效条件」，那是最容易死的地方。最后看当期实况，避开正在剧烈出清的行业（比如 2026 年的光伏、储能、部分餐饮品类）。转行则反过来：先看岗位页的能力要求和 AI 影响，找到你想去的岗位，再看它分布在哪些行业。"}],"metrics":[{"k":"增长前景","v":"1–5 分","d":"行业在扩张还是收缩。5 分是高速增长（如 AI、创新药），1 分是明显萎缩（如水泥、部分地产环节）。注意：增长快不等于机会属于你。","hi":"机会多但死得也快","lo":"格局稳定、现金流可靠"},{"k":"竞争强度","v":"1–5 分","d":"抢饭碗的人多不多。5 分是血海（餐饮、快递、消费电子），1 分是垄断或高门槛（铁路、电网、殡葬）。","hi":"必须靠差异化或成本领先活下去","lo":"有牌照或资源壁垒，日子舒服"},{"k":"监管强度","v":"1–5 分","d":"政府管得多严。5 分是一举一动都要审批（医药、金融、教育、军工），1 分是基本没人管（部分服务业）。","hi":"合规成本高，但壁垒也高","lo":"灵活，但随时可能被新政改写规则"},{"k":"毛利水平","v":"1–5 分","d":"卖出价减去直接成本后的空间。5 分是极高毛利（软件、IP 授权、奢侈品），1 分是微利（快递、代工、大宗贸易）。","hi":"有定价权，能攒下钱做研发或营销","lo":"靠规模和周转，一分钱掰成两半花"},{"k":"收入经常性","v":"1–5 分","d":"这个月的收入，下个月还在不在。5 分是订阅制、物业费、保险这种自动续上的，1 分是一锤子买卖（项目制、房产销售、活动服务）。","hi":"可预测，能规划，抗周期","lo":"波动大，忙一年歇半年"},{"k":"资本密集度","v":"1–5 分","d":"入行要砸多少钱。5 分是重资产（晶圆厂、机场、电网），1 分是轻资产（咨询、设计、内容）。","hi":"门槛高，利润归资本方","lo":"门槛低，利润归能力强的人"}],"concepts":[{"t":"毛利 vs 净利","d":"毛利是卖价减直接成本（原料、生产人工），净利是再扣掉房租、工资、营销、研发、税之后真正剩下的。餐饮毛利看着 60%，净利常常只有 3%–5%。看一个行业赚不赚钱，永远看净利。"},{"t":"周转是什么","d":"同样一块钱，一年能翻几次身。超市一盒牛奶可能只赚两毛，但一个星期就卖掉，一年翻几十次，累积起来很可观。周转慢的行业（房地产、高端制造）一次要赚很多才划得来。"},{"t":"经常性收入","d":"一次获取、持续收钱的收入。订阅费、物业费、保险保费、耗材复购都算。这是最值钱的收入类型，因为它可预测、能估值、抗周期。所以软件公司哪怕亏损，估值也往往高于利润更厚的制造业。"}]};
window.ATLAS_GLOSSARY = [{"t":"毛利","d":"卖价减去直接成本（原料、生产人工、包装）后剩下的部分。还没扣房租、工资、营销这些费用。","eg":"一杯咖啡卖 20 元，豆子牛奶杯子加起来 5 元，毛利 15 元，毛利率 75%。"},{"t":"净利","d":"毛利再扣掉房租、工资、营销、研发、税费之后，真正落进口袋的钱。","eg":"那杯咖啡还要摊门店租金、咖啡师工资、平台抽成，最后可能只剩 3 元。"},{"t":"成本收入比","d":"每赚 100 块钱要花多少费用。银行常用这个指标，30% 表示赚 100 块花 30 块。","eg":"招商银行成本收入比 29.7%，意思是赚 100 元只花 30 元成本，效率很高。"},{"t":"现金流","d":"账上实际有多少活钱能随时动用。和利润是两回事——赚钱的公司也可能因为钱都在客户账上而发不出工资。","eg":"工程队干了活但甲方年底才结款，这一年利润是正的，现金流是负的。"},{"t":"资产","d":"公司拥有并能换来钱的东西。厂房、设备、专利、现金、存货都算。","eg":"晶圆厂最值钱的资产是光刻机，一台上亿美元。"},{"t":"负债","d":"公司欠别人的钱。贷款、应付款、预收的会员费都算。","eg":"健身房先收你一年会费，这笔钱在法律上就是它的负债。"},{"t":"杠杆","d":"借来的钱放大收益或亏损。赚的时候翻倍赚，亏的时候翻倍亏。","eg":"首付 30% 买房，房价涨 10% 你的本金赚 33%；跌 10% 你亏 33%。"},{"t":"ROE（净资产收益率）","d":"股东每投 100 块，一年能赚回几块。衡量生意回报的核心指标。","eg":"ROE 15% 表示投 100 万一年赚 15 万。"},{"t":"IRR（内部收益率）","d":"一个项目全生命周期算下来，年化能赚多少。投电站、做投资常用。","eg":"储能项目 IRR 8%–10%，比存银行强，但不如好股票。"},{"t":"订阅制","d":"按期收钱，期间持续提供服务。最理想的商业模式，因为收入可预测。","eg":"Netflix、Office 365、物业费都是订阅。"},{"t":"按量计费","d":"用多少付多少。云服务器、API 调用、水电费都是。","eg":"阿里云按用了多少核 CPU、多少 GB 存储收费。"},{"t":"按结果付费","d":"事情办成了才收钱。2026 年兴起的 AI 收费方式，风险高但客单价高。","eg":"AI 客服按实际解决的客户问题数收费，客单价是传统订阅的 2.1 倍。"},{"t":"抽成 / 佣金","d":"促成了交易，按成交额收一定比例。平台最常见的收钱方式。","eg":"美团从每笔外卖收约 20% 佣金。"},{"t":"剃刀刀片模式","d":"主机便宜卖甚至白送，靠强制耗材长期收钱。","eg":"打印机几百块，墨盒比机器还贵；IVD 检测仪器装机，靠试剂复购赚钱。"},{"t":"预付费","d":"先收钱后服务。改善现金流，但如果倒闭就是债务。","eg":"理发店办卡、健身房年卡、培训机构学费。"},{"t":"版税 / 授权费","d":"把无形资产（专利、IP、技术）租给别人用，按收入比例或固定金额收费。","eg":"ARM 每卖出一颗芯片收一次钱；迪士尼授权一个卡通形象收一笔授权金。"},{"t":"Carry（超额收益分成）","d":"投资赚的钱超过约定门槛后，管理人抽一定比例。通常 20%。","eg":"基金赚了 10 亿，超过 8% 门槛的部分管理人抽 20%。"},{"t":"价差 /  Spread","d":"买入价和卖出价之间的差额。大宗商品、金融交易的利润来源。","eg":"3 万元收硅料，加工成组件卖出去，中间就是价差。"},{"t":"价值链","d":"一件产品从原材料到消费者手里，经过的每一个环节。","eg":"光伏价值链：硅料 → 硅片 → 电池片 → 组件 → 电站。"},{"t":"产业链上下游","d":"上游是供原料的，下游是买成品的。上游涨价，下游成本就高。","eg":"锂矿是上游，电池厂是中游，车企是下游。"},{"t":"产能过剩","d":"造出来的东西超过市场需求，只能靠降价抢单，最后全行业亏损。","eg":"光伏产能是全球需求的 2 倍多，组件价格被打到成本线以下。"},{"t":"价格战 / 内卷","d":"同行互相降价抢市场，最后谁都赚不到钱。","eg":"储能电芯三年跌 70% 多，从 1.2 元/Wh 跌到 0.28 元/Wh。"},{"t":"反内卷","d":"政府出手制止恶性价格战，保护产业链盈利能力。","eg":"2026 年工信部推动光伏、汽车等行业设定价格下限和能效标准。"},{"t":"国产替代","d":"把原来靠进口的东西，换成国产的。通常意味着订单和利润给国内厂商。","eg":"半导体设备国产化率从 24% 升到 35%，省下的钱给了北方华创这类公司。"},{"t":"卡脖子","d":"关键技术或设备被外国垄断，买不到就生产不了。","eg":"中国造不了 EUV 光刻机，5nm 以下芯片就难以量产。"},{"t":"渗透率","d":"新产品占整个市场的比例。超过 50% 说明它已成主流。","eg":"2026 年 4 月新能源车零售渗透率 61.4%，每卖 10 辆有 6 辆是新能源。"},{"t":"存量市场","d":"新客户基本被瓜分完，只能从同行手里抢。竞争最激烈的阶段。","eg":"房地产进入存量时代：二手房交易占比 52.4%，首次超过新房。"},{"t":"洗牌 / 出清","d":"行业亏损期，撑不住的企业退出，活下来的变强。","eg":"2026 年光伏出清，预计淘汰 30% 以上落后产能。"},{"t":"规模化量产","d":"从造几台样品，到能稳定造几万台。成本和良率的考验。","eg":"人形机器人 2026 年进入量产元年，但关节良率只有 60%。"},{"t":"良率","d":"生产出来的产品里，合格品占多少。良率低等于白干。","eg":"晶圆厂良率从 60% 提到 90%，成本能降一半。"},{"t":"护城河 / 壁垒","d":"让别人抢不走你生意的优势。品牌、专利、牌照、网络效应都算。","eg":"茅台的护城河是品牌，ASML 的护城河是技术，中国石油的护城河是牌照。"},{"t":"网络效应","d":"用的人越多，产品越有价值，于是更多人用。平台型生意的核心。","eg":"微信你朋友都在用，所以你不得不用。"},{"t":"转换成本","d":"客户换供应商要付出的代价。越高越留得住客户。","eg":"银行核心系统换成国产数据库，迁移成本和风险极高，所以一用就是十几年。"},{"t":"定价权","d":"能不能涨价而客户不跑。有定价权的才是好生意。","eg":"苹果涨价照样有人买，快递涨价客户立刻换别家。"},{"t":"牌照 / 准入","d":"政府发的经营许可。有牌照的行业，竞争天然受限。","eg":"银行、保险、支付、殡葬、频谱，没牌照做不了。"},{"t":"特许经营","d":"政府授权某家企业独家经营某项公共服务。","eg":"自来水公司、燃气公司、高速公路运营方。"},{"t":"规模效应","d":"量越大，单位成本越低。制造业的核心竞争力。","eg":"蜜雪冰城一年卖几十亿杯，供应链能把成本压到别人做不到的水平。"},{"t":"一站式 / 整体方案","d":"不只卖一个产品，而是把整套服务打包卖。客单价和黏性都更高。","eg":"光伏企业从卖组件转向「光伏+储能+运维」整体方案，摆脱低价竞争。"},{"t":"IPO","d":"公司第一次向公众卖股票，从私募市场进入公开市场。","eg":"摩尔线程、长鑫存储推进 IPO，为扩产融资。"},{"t":"融资轮次","d":"创业公司按阶段融资：天使轮、A 轮、B 轮……每一轮换一部分股权。","eg":"具身智能公司 2026 上半年融资 935 亿，前 5 家拿走 60% 以上。"},{"t":"产业资本 vs 财务资本","d":"产业资本是同行企业投的（带订单和供应链），财务资本是投资基金投的（只图回报）。","eg":"2026 年产业资本占比两年从 28% 升到 45%，意味着竞争变成巨头供应链战争。"},{"t":"BD（商务拓展）","d":"药企把研发管线的权益卖给别的公司，换首付款和分成。创新药企的主要收入来源。","eg":"信达生物把新分子授权给礼来，拿 3.5 亿美元首付，后续最高 85 亿里程碑。"},{"t":"License-out","d":"把技术或产品的海外权益授权出去，收授权费和销售分成。","eg":"2026 上半年中国创新药 License-out 潜在总额 1100 亿美元。"},{"t":"里程碑付款","d":"合作达成后，按研发或销售节点分期付的钱。听着美，兑现率很低。","eg":"全球 BD 交易临床 III 期里程碑兑现率只有 12%。"},{"t":"Co-Co 模式","d":"共同开发、共担成本、共享利润。比单纯卖权益保留更多话语权。","eg":"恒瑞与 BMS 合作 13 个项目，恒瑞保留共同开发和商业化选择权。"},{"t":"估值","d":"市场认为这家公司值多少钱。科技公司常按收入倍数估，不看利润。","eg":"SaaS 公司按 ARR 的 10 倍估值，哪怕还在亏损。"},{"t":"ARR（年度经常性收入）","d":"订阅业务一年能稳定收到的钱。SaaS 公司最核心的指标。","eg":"ARR 1 亿的 SaaS 公司，估值可能在 10 亿。"},{"t":"NDR（净收入留存）","d":"老客户今年付的钱比去年多了多少。超过 100% 说明不拉新也能增长。","eg":"NDR 120% 表示老客户群体今年多付了 20%。"},{"t":"LTV / CAC","d":"一个客户一辈子贡献的利润，除以获取他花的成本。要大于 3 才健康。","eg":"花 1000 元获客，客户三年贡献 5000 元，LTV/CAC = 5，很划算。"},{"t":"FTE（全职当量）","d":"一个全职员工的工作量。AI 按 FTE 计费就是按「替代了几个人」收钱。","eg":"数字员工 Agent 按每月替代 2 个客服的 FTE 收费。"},{"t":"人效","d":"每个员工创造多少收入或利润。服务业的生死线。","eg":"咨询公司人效低就亏，因为主要成本就是人。"},{"t":"降本增效","d":"砍成本、提效率。2026 年企业的主旋律，通常意味着裁员。","eg":"甲骨文净利润涨 95% 同时裁 3 万人，省下的钱投 AI。"},{"t":"可迁移能力","d":"换个行业还能用的本事。沟通、分析、项目管理都算。","eg":"做销售的可迁移到任何行业，做晶圆工艺的换行很难。"},{"t":"复合型人才","d":"跨多个领域都有能力的人。最不容易被替代。","eg":"懂药学又懂专利法的 IP 岗，懂机械又懂软件的自动化工程师。"},{"t":"蓝领溢价","d":"技术工人工资涨得比白领快，因为缺人。","eg":"近十年蓝领收入涨幅 225%，白领只有 30%。"},{"t":"制程 / 纳米","d":"芯片上晶体管做得多小。数字越小越先进、越难造。","eg":"14nm 是成熟主流，7nm 是先进，5nm 以下需要 EUV 光刻机。"},{"t":"EUV 光刻机","d":"造最先进芯片必需的超精密设备，全球只有荷兰 ASML 能造，且不对中国出口。","eg":"没有 EUV，中国 5nm 以下芯片就无法量产。"},{"t":"Chiplet / 先进封装","d":"把多个小芯片拼成一颗大芯片，绕过制程限制提升性能。","eg":"长电科技的 2.5D/3D 封装，让国产芯片在不升级制程下也能提升算力。"},{"t":"Agent（智能体）","d":"能自己规划步骤、调用工具、完成任务的 AI，不只是聊天。","eg":"你说「帮我订最便宜的机票」，它自己查航班、比价、下单。"},{"t":"MCP（模型上下文协议）","d":"AI 连接外部工具的统一标准，让不同 AI 能共用同一批工具。","eg":"一个 MCP Server 能同时服务多个模型，不用重复开发。"},{"t":"Token","d":"AI 处理文字的最小单位，按 Token 数量计费。","eg":"GPT-6 Astra 每百万 Token 输入 10 美元、输出 50 美元。"},{"t":"推理成本","d":"运行 AI 模型花的算力钱。决定 AI 服务能不能赚钱。","eg":"2026 年模型厂商推理利润率从 10%–20% 升到 50%–65%。"},{"t":"具身智能","d":"有身体、能在物理世界干活的 AI。人形机器人、无人机都算。","eg":"2026 年全球人形机器人出货预计破 5.1 万台。"},{"t":"RAG（检索增强生成）","d":"让 AI 先查资料再回答，减少胡说八道。","eg":"企业把内部文档做成知识库，AI 回答前先检索相关段落。"},{"t":"ERP / MES / WMS","d":"企业管理软件：ERP 管整体资源，MES 管生产线，WMS 管仓库。","eg":"上了 MES 的工厂能实时看到每台设备的产量和良率。"},{"t":"净息差（NIM）","d":"银行放贷收的利息减去付给储户的利息，占贷款的比例。银行最主要的收入来源。","eg":"NIM 1.41% 表示贷 100 元赚 1.41 元息差。"},{"t":"不良贷款率","d":"银行贷款里收不回来的比例。越高说明资产质量越差。","eg":"宁波银行个人贷款不良率 2.00%，个人经营贷高达 3.81%。"},{"t":"财富管理","d":"帮客户打理钱，收管理费和销售提成。银行最看重的中间业务。","eg":"招行代销基金收入增 61.4%，不占资本、不担风险，纯赚手续费。"},{"t":"拨备覆盖率","d":"银行为坏账准备的钱，是不良贷款的多少倍。越高越安全。","eg":"招行拨备覆盖率 385%，意味着准备金是坏账的近 4 倍。"},{"t":"两融","d":"借钱给客户买股票（融资）和借股票给客户卖（融券）。券商的利息收入。","eg":"市场行情好时两融余额暴增，券商利息收入跟着涨。"},{"t":"综合成本率","d":"财险每收 100 元保费，赔付加费用花多少。低于 100% 才赚承保的钱。","eg":"综合成本率 98% 表示承保赚 2%，但投资端可能赚更多。"},{"t":"利差损","d":"保险承诺给客户的收益，高于自己投资能赚到的，差额就是亏损。","eg":"低利率环境下，以前卖的高收益保单变成保险公司的包袱。"},{"t":"数字人民币","d":"央行发行的法定数字货币。2026 年起定位从现金升级为存款货币。","eg":"实名钱包余额 2026 年 1 月起按活期计息，纳入存款保险。"},{"t":"集采","d":"政府组织大批量采购，用低价换市场。医药、医疗器械利润的主要杀手。","eg":"心脏支架从 1.3 万降到 700 元，厂家利润大幅压缩。"},{"t":"DRG / DIP","d":"医保按病种打包付费，治一个病给固定金额。超支医院自己承担。","eg":"医院必须控制成本，过度治疗直接亏钱。"},{"t":"报行合一","d":"保险产品的报备价格必须和实际执行一致，压缩渠道佣金空间。","eg":"过去给渠道 40% 佣金，现在被限制到更低。"},{"t":"信创","d":"用国产软硬件替换外国产品。政府和金融机构的硬要求。","eg":"2027 年金融业关键软硬件要 100% 国产替代。"},{"t":"双碳","d":"2030 碳达峰、2060 碳中和。所有能源政策的底层逻辑。","eg":"高耗能行业要买碳配额，光伏风电因此获得溢价。"},{"t":"CCER","d":"国家核证的自愿减排量，可以买卖。把减排变成资产。","eg":"一片森林一年的碳汇能卖几十万。"},{"t":"REITs","d":"把基础设施资产（产业园、高速、仓储）证券化，让普通人能投资。","eg":"产业园区发行 REITs，提前收回投资再投新项目。"},{"t":"PPP / 特许经营","d":"政府出政策，企业出钱建设和运营，用未来收益回收投资。","eg":"高速公路 BOT：企业建路，收 20 年过路费，再无偿交给政府。"}];
window.ATLAS_MACRO = {"asOf":"2026-10","gdp":"机构预测全年 GDP 增速 4.7%–4.8%，处于 4.5%–5% 目标区间","consumption":"社零预计全年增 4.5%–5.5%，服务消费增速 5.5%–6.5% 快于商品消费","investment":"制造业投资增 6%–7%，高技术制造业增 10% 以上；基建 3%–4%","export":"出口预计增 4%–5%，对东盟与新兴市场强于发达市场","price":"PPI 从 2025 年的 -2.6% 回升至 2026 年预计 +2.0%，反内卷政策抑制过度价格竞争","structure":"结构上冰火两重天：硬科技与高端制造扩张，地产链与传统产能收缩"};

window.ATLAS_MODEL_TREND = {"net-interest-margin":"招行 NIM 1.83%，宁波 1.70%，交行 1.23%；负债成本下降是企稳主因","asset-management-fee":"招行代销基金收入增 61.40%、代理证券交易增 46.05%、大财富管理收入增 18.44%","insurance-premium":"报行合一全面执行压缩渠道佣金；低利率环境下利差损压力仍在","real-estate-sale":"1–8 月新房销售面积 -12.1%，二手房占比首次过半达 52.4%","property-rental":"二手房网签 1–8 月增 10.6%，16 个省份二手住宅交易量超新建商品住宅","saas-subscription":"West Monroe 预测按座位许可将终结；Salesforce 公开转向按业务结果或收入增量分成","franchise-fee":"头部品牌转向降低加盟门槛、提高供货与服务分成，与加盟商共担","usage-metering":"OpenAI 2026 年 9 月测试按结果付费：AI 没干完活不收费；Sierra、Fin 已在协议中写入该规则","api-call-fee":"智谱 2026 年中报 API 收入同比增 2735.7%，占比从 15.2% 升至 86.5%","power-generation-margin":"114 号文将独立储能纳入容量电价，项目 IRR 8%–10%；辅助服务收益成新来源","ad-network":"AI 重塑内容生产与分发效率，广告加载率与精准度决定单价","marketplace-take-rate":"网约车抽成比例被要求不超过 30%；外卖平台抽成纳入监管，配送费预计涨 15%–25%","professional-hourly":"能按结果定价的服务（成本节约分成、成功率计费）客单价是传统模式的 2.1 倍","talent-placement-fee":"2026 上半年美国 8.8 万个岗位因 AI 消失，5 月单月 1.4 万人占当月裁员 40%；22–25 岁人群就业率降 16%","manufacturing-margin":"汽车行业前 7 个月利润率 3.6%、利润总额同比降 20%；反内卷政策试图修复产业链盈利","product-resale":"光伏组件 0.77 元/W 低于现金成本，卖一片亏一片；水泥 300–350 元/吨接近成本线","consumable-razor-blade":"IVD 试剂集采与肝功生化降价压缩耗材溢价空间","licensing-royalty":"2026 上半年中国 License-out 潜在总额 1100 亿美元，占全球 59.3%","milestone-payment":"宜明昂科与 Instil Bio 合作终止，仅收到 3500 万美元，占交易额 1.7%","government-contract":"2026 年财政政策定调更加积极，向新基建、科技创新、绿色低碳倾斜","performance-fee":"62% 的企业客户更愿按结果付费，比 2024 年高 37 个百分点"};

<script>
(function () {
  'use strict';

  var SECTORS = window.ATLAS_SECTORS;
  var ROLE_FAMILIES = window.ATLAS_ROLE_FAMILIES;
  var MODEL_FAMILIES = window.ATLAS_MODEL_FAMILIES;
  var IND = window.ATLAS_INDUSTRIES;
  var ROLES = window.ATLAS_ROLES;
  var MODELS = window.ATLAS_MODELS;
  var STATS = window.ATLAS_STATS;
  var MACRO = window.ATLAS_MACRO;
  var GUIDE = window.ATLAS_GUIDE;
  var GLOSSARY = window.ATLAS_GLOSSARY;
  var MODEL_TREND = window.ATLAS_MODEL_TREND || {};

  var SECTOR_BY_ID = {};
  SECTORS.forEach(function (s) { SECTOR_BY_ID[s.id] = s; });
  var IND_BY_ID = {};
  IND.forEach(function (i) { IND_BY_ID[i.id] = i; });
  var ROLE_BY_ID = {};
  ROLES.forEach(function (r) { ROLE_BY_ID[r.id] = r; });
  var MODEL_BY_ID = {};
  MODELS.forEach(function (m) { MODEL_BY_ID[m.id] = m; });

  var SECTOR_COLOR = {};
  SECTORS.forEach(function (s, i) {
    SECTOR_COLOR[s.id] = 'var(--a' + (i + 1) + ')';
  });
  var FAMILY_COLOR = {};
  ROLE_FAMILIES.concat(MODEL_FAMILIES).forEach(function (f, i) {
    FAMILY_COLOR[f.id] = 'var(--a' + ((i % 15) + 1) + ')';
  });

  var state = {
    view: 'industry',
    q: '',
    sector: 'all',
    family: 'all',
    minGrowth: 0,
    sort: 'name',
    onlyHigh: false   // 仅看高毛利或高增长
  };

  // ── 工具 ──
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) {
    return String(s || '').toLowerCase().replace(/\s+/g, '');
  }
  function meter(k, v, color) {
    return '<div class="meter"><span class="meter-k">' + k + '</span>' +
      '<span class="meter-t"><span class="meter-f" style="width:' + (v / 5 * 100) + '%;background:' + color + '"></span></span>' +
      '<span class="meter-v">' + v + '</span></div>';
  }
  function tags(list, mapper, limit) {
    var out = [];
    var shown = list.slice(0, limit || 3);
    shown.forEach(function (x) {
      var m = mapper ? mapper(x) : null;
      out.push(m
        ? '<a class="d-tag" href="#" data-goto="' + m.view + '" data-id="' + esc(x) + '">' + esc(m.label) + '</a>'
        : '<span class="d-tag">' + esc(x) + '</span>');
    });
    if (list.length > shown.length) out.push('<span class="d-tag">+' + (list.length - shown.length) + '</span>');
    return '<div class="d-tags">' + out.join('') + '</div>';
  }

  // ── 数据集合 ──
  function currentSet() {
    return state.view === 'industry' ? IND : state.view === 'role' ? ROLES : MODELS;
  }
  function itemColor(it) {
    if (state.view === 'industry') return SECTOR_COLOR[it.sector] || 'var(--accent)';
    return FAMILY_COLOR[it.family] || 'var(--accent)';
  }
  function itemSub(it) {
    if (state.view === 'industry') {
      var s = SECTOR_BY_ID[it.sector];
      return s ? s.name : '';
    }
    if (state.view === 'role') {
      var rf = ROLE_FAMILIES.filter(function (f) { return f.id === it.family; })[0];
      return rf ? rf.name : '';
    }
    var mf = MODEL_FAMILIES.filter(function (f) { return f.id === it.family; })[0];
    return mf ? mf.name : '';
  }

  function match(it) {
    var q = norm(state.q);
    if (q) {
      var arr = function (v) { return Array.isArray(v) ? v.join('') : (v || ''); };
      var hay = norm([
        it.name, it.en, it.note, it.formula, it.core,
        arr(it.revenue), arr(it.cost), arr(it.kpi),
        arr(it.skills), arr(it.chain), arr(it.trend),
        arr(it.risk), arr(it.cases), arr(it.entry),
        arr(it.lever), arr(it.tools), arr(it.path),
        // 小白讲解层字段，让新手也能用大白话搜到
        it.plain, it.who, it.pain, it.howto, it.analogy, it.watch, it.reality, it.advice
      ].join(' '));
      if (hay.indexOf(q) === -1) return false;
    }
    if (state.view === 'industry') {
      if (state.sector !== 'all' && it.sector !== state.sector) return false;
      if (state.minGrowth && it.growth < state.minGrowth) return false;
      if (state.onlyHigh && !(it.margin >= 4 || it.growth >= 4)) return false;
    } else {
      if (state.family !== 'all' && it.family !== state.family) return false;
    }
    return true;
  }

  function sorted(list) {
    var key = state.sort;
    if (state.view === 'role') key = 'name';
    var arr = list.slice();
    arr.sort(function (a, b) {
      if (key === 'name') return a.name.localeCompare(b.name, 'zh-Hans-CN');
      return (b[key] || 0) - (a[key] || 0) || a.name.localeCompare(b.name, 'zh-Hans-CN');
    });
    return arr;
  }

  // ── 渲染：侧栏 ──
  function renderFilters() {
    var box = document.getElementById('filters');

    if (state.view === 'industry') {
      var g = el('div');
      g.appendChild(el('p', 'side-h', '板块'));
      var l = el('div', 'f-list');
      var all = el('button', 'f-item' + (state.sector === 'all' ? ' is-on' : ''));
      all.innerHTML = '<span class="f-dot" style="background:var(--accent)"></span>全部板块<span class="f-num">' + IND.length + '</span>';
      all.onclick = function () { state.sector = 'all'; render(); };
      l.appendChild(all);
      SECTORS.forEach(function (s) {
        var n = IND.filter(function (i) { return i.sector === s.id; }).length;
        var b = el('button', 'f-item' + (state.sector === s.id ? ' is-on' : ''));
        b.innerHTML = '<span class="f-dot" style="background:' + SECTOR_COLOR[s.id] + '"></span>' +
          esc(s.name) + '<span class="f-num">' + n + '</span>';
        b.onclick = function () { state.sector = s.id; render(); };
        l.appendChild(b);
      });
      g.appendChild(l);
      box.appendChild(g);

      var g2 = el('div');
      g2.appendChild(el('p', 'side-h', '增长前景 ≥'));
      var r = el('div', 'range-row');
      var inp = document.createElement('input');
      inp.type = 'range'; inp.min = 0; inp.max = 5; inp.step = 1; inp.value = state.minGrowth;
      inp.setAttribute('aria-label', '最低增长前景');
      var val = el('span', 'range-val', String(state.minGrowth));
      inp.oninput = function () { state.minGrowth = +inp.value; val.textContent = inp.value; renderGrid(); };
      r.appendChild(inp); r.appendChild(val);
      g2.appendChild(r);
      box.appendChild(g2);

      var g3 = el('div');
      g3.appendChild(el('p', 'side-h', '快速筛选'));
      var t = el('div', 'toggles');
      var tg = el('button', 'tg' + (state.onlyHigh ? ' is-on' : ''));
      tg.innerHTML = '<span class="tg-box"><svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>高毛利或高增长';
      tg.onclick = function () { state.onlyHigh = !state.onlyHigh; render(); };
      t.appendChild(tg);
      g3.appendChild(t);
      box.appendChild(g3);

    } else if (state.view === 'role') {
      var gr = el('div');
      gr.appendChild(el('p', 'side-h', '岗位族'));
      var lr = el('div', 'f-list');
      var allr = el('button', 'f-item' + (state.family === 'all' ? ' is-on' : ''));
      allr.innerHTML = '<span class="f-dot" style="background:var(--accent)"></span>全部<span class="f-num">' + ROLES.length + '</span>';
      allr.onclick = function () { state.family = 'all'; render(); };
      lr.appendChild(allr);
      ROLE_FAMILIES.forEach(function (f) {
        var n = ROLES.filter(function (r) { return r.family === f.id; }).length;
        if (!n) return;
        var b = el('button', 'f-item' + (state.family === f.id ? ' is-on' : ''));
        b.innerHTML = '<span class="f-dot" style="background:' + FAMILY_COLOR[f.id] + '"></span>' +
          esc(f.name) + '<span class="f-num">' + n + '</span>';
        b.onclick = function () { state.family = f.id; render(); };
        lr.appendChild(b);
      });
      gr.appendChild(lr);
      box.appendChild(gr);
    } else {
      var gm = el('div');
      gm.appendChild(el('p', 'side-h', '模式族'));
      var lm = el('div', 'f-list');
      var allm = el('button', 'f-item' + (state.family === 'all' ? ' is-on' : ''));
      allm.innerHTML = '<span class="f-dot" style="background:var(--accent)"></span>全部<span class="f-num">' + MODELS.length + '</span>';
      allm.onclick = function () { state.family = 'all'; render(); };
      lm.appendChild(allm);
      MODEL_FAMILIES.forEach(function (f) {
        var n = MODELS.filter(function (m) { return m.family === f.id; }).length;
        var b = el('button', 'f-item' + (state.family === f.id ? ' is-on' : ''));
        b.innerHTML = '<span class="f-dot" style="background:' + FAMILY_COLOR[f.id] + '"></span>' +
          esc(f.name) + '<span class="f-num">' + n + '</span>';
        b.onclick = function () { state.family = f.id; render(); };
        lm.appendChild(b);
      });
      gm.appendChild(lm);
      box.appendChild(gm);
    }
  }

  // ── 渲染：筛选条 ──
  function renderChips() {
    var box = document.getElementById('chips');
    box.innerHTML = '';
    var add = function (label, val, clear) {
      var c = el('span', 'chip');
      c.innerHTML = esc(label) + ' <b>' + esc(val) + '</b> ';
      var x = el('button', '', '✕');
      x.setAttribute('aria-label', '移除筛选 ' + label);
      x.onclick = clear;
      c.appendChild(x);
      box.appendChild(c);
    };
    var any = false;
    if (state.q) { add('搜索', state.q, function () { state.q = ''; document.getElementById('q').value = ''; render(); }); any = true; }
    if (state.view === 'industry' && state.sector !== 'all') {
      add('板块', SECTOR_BY_ID[state.sector].name, function () { state.sector = 'all'; render(); }); any = true;
    }
    if (state.view !== 'industry' && state.family !== 'all') {
      add('分类', itemSub({ family: state.family }), function () { state.family = 'all'; render(); }); any = true;
    }
    if (state.view === 'industry' && state.minGrowth) {
      add('增长 ≥', String(state.minGrowth), function () { state.minGrowth = 0; render(); }); any = true;
    }
    if (state.view === 'industry' && state.onlyHigh) {
      add('精选', '高毛利或高增长', function () { state.onlyHigh = false; render(); }); any = true;
    }
    if (any) {
      var c = el('button', 'chip clear', '清空全部');
      c.onclick = function () {
        state.q = ''; state.sector = 'all'; state.family = 'all';
        state.minGrowth = 0; state.onlyHigh = false;
        document.getElementById('q').value = '';
        render();
      };
      box.appendChild(c);
    }
    document.getElementById('sort').parentNode.style.display = state.view === 'industry' ? '' : 'none';
  }

  // ── 渲染：卡片 ──
  function renderGrid() {
    var grid = document.getElementById('grid');
    var empty = document.getElementById('empty');
    var list = sorted(currentSet().filter(match));
    grid.innerHTML = '';
    if (!list.length) { empty.hidden = false; return; }
    empty.hidden = true;

    var frag = document.createDocumentFragment();
    list.forEach(function (it) {
      var c = el('button', 'card');
      c.style.setProperty('--c', itemColor(it));
      c.setAttribute('data-id', it.id);
      var h = '';

      h += '<div class="c-head"><span class="c-name">' + esc(it.name) + '</span>' +
        (it.en ? '<span class="c-en">' + esc(it.en) + '</span>' : '') +
        '<span class="c-tag">' + esc(itemSub(it)) + '</span></div>';

      var note = state.view === 'industry' ? it.note
        : state.view === 'role' ? it.core
        : it.formula + ' — ' + it.margin;
      h += '<p class="c-note">' + esc(note) + '</p>';

      if (state.view === 'industry') {
        h += '<div class="c-meters">' +
          meter('增长', it.growth, itemColor(it)) +
          meter('毛利', it.margin, itemColor(it)) +
          meter('监管', it.regulation, itemColor(it)) +
          '</div>';
      } else if (state.view === 'role') {
        h += '<div class="c-meters">' +
          meter('薪酬带宽', it.pay.senior[1] >= 60 ? 5 : it.pay.senior[1] >= 35 ? 4 : it.pay.senior[1] >= 22 ? 3 : 2, itemColor(it)) +
          '</div>';
        h += '<div class="c-foot"><span class="pill">' + esc(it.pay.entry[0]) + '–' + esc(it.pay.entry[1]) + '万起</span>' +
          '<span class="pill">' + esc(it.barrier) + '门槛</span>' +
          (it.industries.length ? '<span class="pill more">' + it.industries.length + ' 个行业</span>' : '') +
          '</div>';
      } else {
        h += '<div class="c-foot">' +
          (it.industries.length
            ? '<span class="pill">' + esc(IND_BY_ID[it.industries[0]].name) + (it.industries.length > 1 ? ' 等 ' + it.industries.length + ' 个行业' : '') + '</span>'
            : '<span class="pill">跨行业通用</span>') +
          '</div>';
      }

      if (state.view === 'industry') {
        h += '<div class="c-foot">';
        it.models.slice(0, 2).forEach(function (m) {
          var mm = MODEL_BY_ID[m];
          if (mm) h += '<span class="pill">' + esc(mm.name) + '</span>';
        });
        if (it.models.length > 2) h += '<span class="pill more">+' + (it.models.length - 2) + '</span>';
        h += '</div>';
      }

      c.innerHTML = h;
      c.onclick = function () { openDrawer(it.id); };
      frag.appendChild(c);
    });
    grid.appendChild(frag);
  }

  // ── 抽屉 ──
  var lastFocus = null;
  function openDrawer(id) {
    var d = document.getElementById('drawer');
    var body = document.getElementById('drawer-body');
    lastFocus = document.activeElement;
    d.hidden = false;
    document.body.style.overflow = 'hidden';
    body.innerHTML = state.view === 'industry' ? industryHTML(id)
      : state.view === 'role' ? roleHTML(id)
      : modelHTML(id);
    body.scrollTop = 0;
    body.querySelectorAll('[data-goto]').forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        var v = a.getAttribute('data-goto');
        var target = a.getAttribute('data-id');
        if (v === 'industry') { state.view = 'industry'; openDrawer(target); }
        else if (v === 'role') { state.view = 'role'; openDrawer(target); }
        else { state.view = 'model'; openDrawer(target); }
        render();
      };
    });
    var x = body.querySelector('.drawer-x') || d.querySelector('.drawer-x');
    if (x) x.focus();
  }
  function closeDrawer() {
    var d = document.getElementById('drawer');
    d.hidden = true;
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function rowsHTML(pairs) {
    return '<dl class="d-rows">' + pairs.map(function (p) {
      return '<div class="d-row"><dt>' + esc(p[0]) + '</dt><dd>' + p[1] + '</dd></div>';
    }).join('') + '</dl>';
  }

  function industryHTML(id) {
    var it = IND_BY_ID[id];
    var c = SECTOR_COLOR[it.sector];
    var h = '';
    h += '<div class="d-hero" style="--c:' + c + '">';
    h += '<div class="d-kicker">' + esc(SECTOR_BY_ID[it.sector].name) + '</div>';
    h += '<h2 class="d-title" id="d-title">' + esc(it.name) + '</h2>';
    h += '<p class="d-sub">' + esc(it.en) + ' · 规模' + esc(it.size) + '</p>';
    h += '</div>';

    // 小白讲解：这行在做什么
    if (it.plain) {
      h += '<div class="d-plain"><div class="d-plain-h">这个行业在做什么</div>' + esc(it.plain) + '</div>';
    }
    h += '<p class="d-lead">' + esc(it.note) + '</p>';

    if (it.who || it.pain || it.howto) {
      h += '<div class="d-sec"><p class="d-sec-h">新手三问</p><div class="d-kv">';
      if (it.who) h += '<div class="d-kv-row"><span class="d-kv-k">谁付钱</span><span class="d-kv-v">' + esc(it.who) + '</span></div>';
      if (it.pain) h += '<div class="d-kv-row"><span class="d-kv-k">难在哪</span><span class="d-kv-v">' + esc(it.pain) + '</span></div>';
      if (it.howto) h += '<div class="d-kv-row"><span class="d-kv-k">怎么了解</span><span class="d-kv-v">' + esc(it.entry) + '</span></div>';
      h += '</div></div>';
    }

    h += '<div class="d-sec"><p class="d-sec-h">六维评分</p><div class="d-metrics">' +
      metricHTML('增长前景', it.growth, '/5') +
      metricHTML('竞争强度', it.competition, '/5') +
      metricHTML('监管强度', it.regulation, '/5') +
      metricHTML('毛利水平', it.margin, '/5') +
      metricHTML('收入经常性', it.recurring, '/5') +
      metricHTML('资本密集度', it.capital, '/5') +
      '</div></div>';

    h += '<div class="d-sec"><p class="d-sec-h">价值链</p><div class="d-chain">' +
      it.chain.map(function (s, i) {
        return (i ? '<span class="chain-arrow">→</span>' : '') + '<span class="chain-step">' + esc(s) + '</span>';
      }).join('') + '</div></div>';

    h += '<div class="d-sec"><p class="d-sec-h">钱从哪来，到哪去</p>' + rowsHTML([
      ['收入来源', tags(it.revenue)],
      ['主要成本', tags(it.cost)],
      ['核心指标', tags(it.kpi)]
    ]) + '</div>';

    h += '<div class="d-sec"><p class="d-sec-h">盈利模式</p>' +
      tags(it.models, function (m) {
        var mm = MODEL_BY_ID[m];
        return mm ? { view: 'model', label: mm.name } : null;
      }, 8) + '</div>';

    h += '<div class="d-sec"><p class="d-sec-h">关键岗位</p>' +
      tags(it.roles, function (r) {
        var rr = ROLE_BY_ID[r];
        return rr ? { view: 'role', label: rr.name } : null;
      }, 8) + '</div>';

    h += '<div class="d-sec"><p class="d-sec-h">入行与能力</p>' + rowsHTML([
      ['常见入口', tags(it.entry)],
      ['核心技能', tags(it.skills)],
      ['代表机构', tags(it.cases)]
    ]) + '</div>';

    h += '<div class="d-sec"><p class="d-sec-h">风险与趋势</p>' + rowsHTML([
      ['主要风险', tags(it.risk)],
      ['演进趋势', tags(it.trend)]
    ]) + '</div>';

    if (it.live) {
      h += '<div class="d-sec"><p class="d-sec-h">当期实况</p>' +
        '<div class="d-live" style="--c:' + c + '">' +
        '<span class="d-live-tag">' + esc(MACRO.asOf) + ' 时点</span><br>' + esc(it.live) + '</div></div>';
    }

    return h;
  }

  function metricHTML(k, v, unit) {
    return '<div class="d-metric"><div class="d-metric-k">' + esc(k) + '</div>' +
      '<div class="d-metric-v">' + v + '<small>' + unit + '</small></div></div>';
  }

  function roleHTML(id) {
    var it = ROLE_BY_ID[id];
    var c = FAMILY_COLOR[it.family];
    var fam = ROLE_FAMILIES.filter(function (f) { return f.id === it.family; })[0];

      h += '<div class="d-plain"><div class="d-plain-h">这个岗位每天在干什么</div>' + esc(it.plain) + '</div>';

    h += '<p class="d-lead">' + esc(it.core) + '</p>';

      h += '<div class="d-sec"><p class="d-sec-h">这份工作的真实状态</p>' +

    }

    h += '<div class="d-sec"><p class="d-sec-h">薪酬带宽（一线城市，万元/年）</p><div class="d-pay" style="--c:' + c + '">' +

      '</div></div>';

    h += '<div class="d-sec"><p class="d-sec-h">能力与工具</p>' + rowsHTML([
      ['核心技能', tags(it.skills)],
      ['常用工具', tags(it.tools)],
      ['考核指标', tags(it.kpi)],
      ['相关证书', tags(it.certs)]
    ]) + '</div>';

    h += '<div class="d-sec"><p class="d-sec-h">发展路径</p><div class="d-chain">' +

      }).join('') + '</div></div>';

    h += '<div class="d-sec"><p class="d-sec-h">AI 影响判断</p><div class="d-callout"><b>对岗位的冲击：</b>' + esc(it.ai) + '</div></div>';

    if (it.advice) {
      h += '<div class="d-sec"><p class="d-sec-h">最该做的一件事</p>' +

    if (it.industries.length) {

  function payRow(k, v) {
    var max = 180;
    var left = Math.min(v[0] / max * 100, 100);
    var w = Math.max((v[1] - v[0]) / max * 100, 4);
    return '<div class="pay-row"><span class="pay-k">' + esc(k) + '</span>' +
      '<span class="pay-bar"><span class="pay-fill" style="left:' + left + '%;width:' + w + '%"></span>' +
      '<span class="pay-txt">' + v[0] + ' – ' + v[1] + '</span></span></div>';
  }

  function modelHTML(id) {
    var it = MODEL_BY_ID[id];
    var c = FAMILY_COLOR[it.family];
    var fam = MODEL_FAMILIES.filter(function (f) { return f.id === it.family; })[0];
    var h = '';
    h += '<div class="d-hero" style="--c:' + c + '">';

      h += '<div class="d-plain"><div class="d-plain-h">这个模式怎么赚钱</div>' + esc(it.plain) + '</div>';

      h += '<div class="d-quote" style="--c:' + c + '"><b>打个比方：</b>' + esc(it.analogy) + '</div>';
    }
    if (it.watch) {
      h += '<div class="d-quote" style="--c:' + c + '"><b>最该盯住：</b>' + esc(it.watch) + '</div>';

    h += '<div class="d-sec"><p class="d-sec-h">怎么赚，怎么亏</p>' + rowsHTML([

      ['利润杠杆', esc(it.lever)],

    ]) + '</div>';

        '<div class="d-live" style="--c:' + c + '">' +
        '<span class="d-live-tag">本期观察</span><br>' + esc(MODEL_TREND[it.id]) + '</div></div>';

      h += '<div class="d-sec"><p class="d-sec-h">适用行业（' + it.industries.length + '）</p>' +

    }
    return h;
  }

  // ── 总渲染 ──
  function render() {
    renderFilters();
    renderChips();
    renderGrid();
    document.querySelectorAll('.tab').forEach(function (t) {
      var on = t.getAttribute('data-view') === state.view;
      t.classList.toggle('is-on', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  // ── 事件 ──
  document.querySelectorAll('.tab').forEach(function (t) {
    t.onclick = function () {
      state.view = t.getAttribute('data-view');
      state.family = 'all';
      state.sector = 'all';
      state.minGrowth = 0;
      state.onlyHigh = false;
      render();
    };
  });

  var q = document.getElementById('q');
  var timer = null;
  q.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = q.value.trim(); renderChips(); renderGrid(); }, 90);
  });

  document.getElementById('sort').onchange = function (e) {
    state.sort = e.target.value;
    renderGrid();
  };

  document.getElementById('reset').onclick = function () {
    state.q = ''; q.value = '';
    state.sector = 'all'; state.family = 'all'; state.minGrowth = 0; state.onlyHigh = false;
    render();
  };

  document.querySelectorAll('[data-close]').forEach(function (n) {
    n.onclick = closeDrawer;
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!document.getElementById('sheet').hidden) { closeSheet(); return; }
      if (!document.getElementById('drawer').hidden) closeDrawer();
    }
    if (e.key === '/' && document.activeElement !== q && !/input|textarea|select/i.test(document.activeElement.tagName)) {
      e.preventDefault();
      q.focus();
    }
  });

  // 主题：默认浅色。只有用户主动切换过才跟随存储值。
  // KEY 带版本号：改默认色时旧存储值自动失效，用户不用手动清。
  var themeBtn = document.getElementById('theme');
  var THEME_KEY = 'atlas-theme-v2';
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  // 未主动选择过一律浅色；主动选过深色才用深色
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  themeBtn.onclick = function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };

  // ── 全屏面板：导读 / 术语表 ──
  var sheetLastFocus = null;
  function openSheet(kind) {
    var sheet = document.getElementById('sheet');
    var title = document.getElementById('sheet-title');
    var body = document.getElementById('sheet-body');
    var q = document.getElementById('sheet-q');
    sheetLastFocus = document.activeElement;
    sheet.hidden = false;
    document.body.style.overflow = 'hidden';
    q.hidden = kind !== 'glossary';
    q.value = '';
    title.textContent = kind === 'guide' ? GUIDE.intro.title : '术语表：把行话翻译成大白话';
    body.innerHTML = kind === 'guide' ? guideHTML() : glossaryHTML('');
    body.scrollTop = 0;
    if (kind === 'guide') bindFaq();
    q.oninput = function () { body.innerHTML = glossaryHTML(q.value.trim()); };
    sheet.querySelector('.drawer-x').focus();
  }
  function closeSheet() {
    document.getElementById('sheet').hidden = true;
    document.body.style.overflow = '';
    if (sheetLastFocus && sheetLastFocus.focus) sheetLastFocus.focus();
  }

  function guideHTML() {
    var h = '';
    GUIDE.intro.body.forEach(function (p) {
      // 段首的「行业」「盈利模式」「岗位」加粗
      h += '<p class="g-para">' + esc(p)
        .replace(/行业/g, '<b>行业</b>')
        .replace(/盈利模式/g, '<b>盈利模式</b>')
        .replace(/岗位/g, '<b>岗位</b>') + '</p>';
    });

    h += '<div class="g-sec"><p class="g-sec-h">四步读法</p><div class="g-steps">';
    GUIDE.steps.forEach(function (s) {
      h += '<div class="g-step"><span class="g-step-n">' + esc(s.n) + '</span>' +
        '<div><div class="g-step-t">' + esc(s.t) + '</div>' +
        '<div class="g-step-d">' + esc(s.d) + '</div></div></div>';
    });
    h += '</div></div>';

    h += '<div class="g-sec"><p class="g-sec-h">六个评分怎么看</p><div class="g-metrics">';
    GUIDE.metrics.forEach(function (m) {
      h += '<div class="g-metric"><div class="g-metric-t">' + esc(m.k) + '</div>' +
        '<div class="g-metric-v">' + esc(m.v) + '</div>' +
        '<div class="g-metric-d">' + esc(m.d) + '</div>' +
        '<div class="g-metric-x"><b>分高：</b>' + esc(m.hi) + '<br><b>分低：</b>' + esc(m.lo) + '</div></div>';
    });
    h += '</div></div>';

    h += '<div class="g-sec"><p class="g-sec-h">三个必须先懂的概念</p><div class="g-concepts">';
    GUIDE.concepts.forEach(function (c) {
      h += '<div class="g-concept"><div class="g-concept-t">' + esc(c.t) + '</div>' +
        '<div class="g-concept-d">' + esc(c.d) + '</div></div>';
    });
    h += '</div></div>';

    h += '<div class="g-sec"><p class="g-sec-h">常见困惑</p><div class="g-faq">';
    GUIDE.faq.forEach(function (f, i) {
      h += '<div class="g-faq-item" data-i="' + i + '">' +
        '<button class="g-faq-q">' + esc(f.q) + '</button>' +
        '<div class="g-faq-a">' + esc(f.a) + '</div></div>';
    });
    h += '</div></div>';
    return h;
  }

  function bindFaq() {
    document.querySelectorAll('.g-faq-item').forEach(function (item) {
      item.querySelector('.g-faq-q').onclick = function () {
        item.classList.toggle('is-open');
      };
    });
  }

  var GL_GROUPS = [
    { k: '钱的基础', keys: ['毛利', '净利', '成本收入比', '现金流', '资产', '负债', '杠杆', 'ROE（净资产收益率）', 'IRR（内部收益率）'] },
    { k: '收钱的方式', keys: ['订阅制', '按量计费', '按结果付费', '抽成 / 佣金', '剃刀刀片模式', '预付费', '版税 / 授权费', 'Carry（超额收益分成）', '价差 /  Spread'] },
    { k: '行业与市场', keys: ['价值链', '产业链上下游', '产能过剩', '价格战 / 内卷', '反内卷', '国产替代', '卡脖子', '渗透率', '存量市场', '洗牌 / 出清', '规模化量产', '良率'] },
    { k: '赚钱的底气', keys: ['护城河 / 壁垒', '网络效应', '转换成本', '定价权', '牌照 / 准入', '特许经营', '规模效应', '一站式 / 整体方案'] },
    { k: '资本与投资', keys: ['IPO', '融资轮次', '产业资本 vs 财务资本', 'BD（商务拓展）', 'License-out', '里程碑付款', 'Co-Co 模式', '估值', 'ARR（年度经常性收入）', 'NDR（净收入留存）', 'LTV / CAC'] },
    { k: '岗位与职场', keys: ['FTE（全职当量）', '人效', '降本增效', '可迁移能力', '复合型人才', '蓝领溢价'] },
    { k: '技术与生产', keys: ['制程 / 纳米', 'EUV 光刻机', 'Chiplet / 先进封装', 'Agent（智能体）', 'MCP（模型上下文协议）', 'Token', '推理成本', '具身智能', 'RAG（检索增强生成）', 'ERP / MES / WMS'] },
    { k: '金融专项', keys: ['净息差（NIM）', '不良贷款率', '财富管理', '拨备覆盖率', '两融', '综合成本率', '利差损', '数字人民币'] },
    { k: '政策与合规', keys: ['集采', 'DRG / DIP', '报行合一', '信创', '双碳', 'CCER', 'REITs', 'PPP / 特许经营'] }
  ];

  function glossaryHTML(q) {
    var h = '';
    var total = 0;
    GL_GROUPS.forEach(function (g) {
      var items = GLOSSARY.filter(function (x) {
        return g.keys.indexOf(x.t) !== -1 && (!q || norm(x.t + x.d + (x.eg || '')).indexOf(norm(q)) !== -1);
      });
      if (!items.length) return;
      total += items.length;
      h += '<div class="gl-group"><p class="gl-group-h">' + esc(g.k) + '</p>';
      items.forEach(function (x) {
        h += '<div class="gl-item"><div class="gl-t">' + esc(x.t) + '</div>' +
          '<div class="gl-d">' + esc(x.d) + '</div>' +
          (x.eg ? '<div class="gl-eg"><b>例子：</b>' + esc(x.eg) + '</div>' : '') +
          '</div>';
      });
      h += '</div>';
    });
    if (!total) h = '<div class="empty"><p>没有匹配的术语。</p></div>';
    return h;
  }

  document.querySelectorAll('[data-sheet-close]').forEach(function (n) { n.onclick = closeSheet; });
  document.getElementById('open-guide').onclick = function () { openSheet('guide'); };
  document.getElementById('open-glossary').onclick = function () { openSheet('glossary'); };

  // 统计
  document.getElementById('s-ind').textContent = STATS.industries;
  document.getElementById('s-role').textContent = STATS.roles;
  document.getElementById('s-model').textContent = STATS.models;
  document.getElementById('s-patch').textContent = STATS.patched;
  document.getElementById('s-glossary').textContent = STATS.glossary;
  document.getElementById('s-asof').textContent = MACRO.asOf.replace('-', ' 年 ') + ' 月';

  // 宏观背景
  var macroBox = document.getElementById('macro');
  var MACRO_LABEL = {
    gdp: '增长', consumption: '消费', investment: '投资',
    export: '出口', price: '价格', structure: '结构'
  };
  Object.keys(MACRO_LABEL).forEach(function (k) {
    if (!MACRO[k]) return;
    var d = el('div', 'macro-item');
    d.innerHTML = '<div class="macro-k">' + MACRO_LABEL[k] + '</div><div class="macro-v">' + esc(MACRO[k]) + '</div>';
    macroBox.appendChild(d);
  });

  render();
})();

</script>
</body>
</html>
